async function cleanRun(){
  const c = cleanState();
  const s = c.scan || {};
  const pkg = c.pkg;
  if(c.running) return;
  if(dfState().demo){
    const would = [];
    (s.entries || []).filter(e => c.sel["e:" + e]).forEach(e => would.push("删除 /data/data/" + pkg + "/" + e));
    if(c.sel.ext) would.push("清除 /sdcard/Android/data/" + pkg);
    if(c.sel.obb) would.push("清除 /sdcard/Android/obb/" + pkg);
    if(c.sel.ssaid) would.push("重置 SSAID（备份 settings_ssaid.xml）");
    if(c.sel.androidid) would.push("重置 Android ID");
    openModal("演示模式", "没有 KernelSU 执行接口，什么都没做",
      '<div class="row-list">' + would.map(x => '<div class="row"><span>·</span><strong style="max-width:100%;text-align:left">' + esc(x) + '</strong></div>').join("") + "</div>",
      '<button data-act="cl-ok">知道了</button>');
    $("modalFooter").querySelector('[data-act="cl-ok"]').onclick = closeModal;
    return;
  }
  c.running = true;
  const log = [];
  busy(true, "清理中…");
  try{
    await sh(`am force-stop ${shq(pkg)} 2>/dev/null; echo __OK__`, 20000);
    log.push("已结束进程");

    const del = (s.entries || []).filter(e => c.sel["e:" + e]);
    if(c.sel.data && del.length){
      const r = await sh(`P=${shq(pkg)}; cd /data/data/$P 2>/dev/null && rm -rf -- ${del.map(shq).join(" ")} && echo __OK__`, 60000);
      log.push(r.stdout.indexOf("__OK__") >= 0 ? "已删除 " + del.length + " 个目录" : "数据目录删除失败");
    }
    if(c.sel.ext && s.hasExt){
      await sh(`rm -rf /sdcard/Android/data/${shq(pkg)} 2>/dev/null; echo __OK__`, 40000);
      log.push("已清除外部数据");
    }
    if(c.sel.obb && s.hasObb){
      await sh(`rm -rf /sdcard/Android/obb/${shq(pkg)} 2>/dev/null; echo __OK__`, 40000);
      log.push("已清除 OBB");
    }
    if(c.sel.ssaid){
      const nv = randSsaid();
      const cmd = [
        'F=/data/system/users/0/settings_ssaid.xml',
        '[ -f "$F" ] || { echo "ssaid=missing"; exit 0; }',
        'B="$F.dfktool.bak"; cp "$F" "$B" 2>/dev/null',
        'N1=$(wc -l < "$B")',
        `awk -v pkg=${shq(pkg)} -v nv=${shq(nv)} '{ if (index($0, "package=\"" pkg "\"") > 0) sub(/value="[0-9]+"/, "value=\"" nv "\""); print }' "$B" > "$F.tmp"`,
        'N2=$(wc -l < "$F.tmp")',
        'if [ "$N1" = "$N2" ]; then mv "$F.tmp" "$F"; chmod 600 "$F"; restorecon "$F" 2>/dev/null; echo "ssaid=ok"; else rm -f "$F.tmp"; echo "ssaid=fail"; fi'
      ].join("; ");
      const r = await sh(cmd, 40000);
      if(/ssaid=ok/.test(r.stdout)) log.push("SSAID 已重置为 " + nv);
      else if(/ssaid=missing/.test(r.stdout)) log.push("找不到 settings_ssaid.xml，跳过");
      else log.push("SSAID 重置失败（已还原备份）");
    }
    if(c.sel.androidid){
      const nv = randAndroidId();
      const r = await sh(`settings put secure android_id ${shq(nv)} 2>&1; echo "id=$(settings get secure android_id 2>/dev/null)"`, 25000);
      const kv = parseKV(r.stdout);
      if(kv.id) log.push("Android ID → " + kv.id);
      else log.push("Android ID 写入失败（需要 WRITE_SECURE_SETTINGS）");
    }
  }finally{
    busy(false);
    c.running = false;
  }
  await loadDF();
  const scanned = cleanState().scan;
  openModal("清理完成", pkg,
    '<div class="row-list">' + log.map(x => '<div class="row"><span>·</span><strong style="max-width:100%;text-align:left">' + esc(x) + '</strong></div>').join("") + "</div>" +
    banner("ok", "建议重启一次", "SSAID 分配和 Android ID 都要重启后才会对所有应用生效。"),
    '<button data-act="cl-ok">知道了</button><button class="primary" data-act="cl-reboot">立即重启</button>');
  $("modalFooter").querySelector('[data-act="cl-ok"]').onclick = closeModal;
  $("modalFooter").querySelector('[data-act="cl-reboot"]').onclick = () => {
    closeModal();
    const a = POWER_ACTIONS.find(x => x.k === "reboot");
    if(a) confirmPower("reboot");
  };

const THERM_STATIC = [

  `o=""; for z in /sys/class/thermal/thermal_zone*; do n=\${z#/sys/class/thermal/thermal_zone}; t=""; IFS= read -r t 2>/dev/null < "$z/type"; [ -n "$t" ] && o="$o$n:$t;"; done; echo "ztypes=$o"`,
  `o=""; for z in /sys/class/thermal/thermal_zone*; do n=\${z#/sys/class/thermal/thermal_zone}; a=""; b=""; IFS= read -r a 2>/dev/null < "$z/trip_point_0_temp"; IFS= read -r b 2>/dev/null < "$z/trip_point_1_temp"; o="$o$n=$a/$b;"; done; echo "ztrips=$o"`,
  `o=""; for z in /sys/class/thermal/thermal_zone*; do n=\${z#/sys/class/thermal/thermal_zone}; v=""; IFS= read -r v 2>/dev/null < "$z/mode"; o="$o$n=$v;"; done; echo "zmodes=$o"`,
  `o=""; c=""; for d in /sys/devices/system/cpu/cpu*/cpufreq; do v=""; m=""; IFS= read -r v 2>/dev/null < "$d/scaling_max_freq"; IFS= read -r m 2>/dev/null < "$d/cpuinfo_max_freq"; [ -n "$v" ] && o="$o$v "; [ -n "$m" ] && c="$c$m "; done; echo "cpu_max=$o"; echo "cpu_ceiling=$c"`,
  `v=""; for f in /sys/class/kgsl/kgsl-3d0/max_gpuclk /sys/class/devfreq/gpufreq/max_freq; do if [ -z "$v" ] && [ -f "$f" ]; then IFS= read -r v 2>/dev/null < "$f"; fi; done; echo "gpu_max=$v"`,
  `o=""; for k in input_current_limit constant_charge_current_max charge_control_limit restrict_chg restrict_cur charging_enabled; do [ -e /sys/class/power_supply/battery/$k ] && o="$o$k;"; done; [ -e /sys/class/power_supply/usb/current_max ] && o="\${o}usb_current_max;"; echo "chg_nodes=$o"`,
  `E=""; for f in /data/adb/modules/*/bin/eg.sh /data/adb/modules_update/*/bin/eg.sh; do [ -f "$f" ] && { E="\${f%/bin/eg.sh}"; break; }; done; echo "eg_dir=$E"`,

  `W=""; [ -n "$E" ] && W="$(sh "$E/bin/webui-server.sh" status 2>/dev/null | tr "\\n" ";")"; echo "web_status=$W"`

function thermalState(){
  if(!state.thermal){
    state.thermal = {
      demo: false, loaded: false, busy: false,

      egZoneHit: 0, egFiles: 0, egMounted: 0, egLog: "",

const EG_ITEMS = [

function egText(c){

const ZONE_CLS_NAME = {cpu: "CPU", gpu: "GPU", batt: "电池", mem: "内存", other: "其他"};
function zoneClass(type){
  const t = String(type || "").toLowerCase();
  if(/batt|bms|charg/.test(t)) return "batt";
  if(/gpu|gpuss|kgsl|mali|adreno/.test(t)) return "gpu";
  if(/cpu|soc|tsens|cpullc|silver|gold|prime|cluster|core/.test(t)) return "cpu";
  if(/mem|ddr|lpddr/.test(t)) return "mem";
  return "other";
}
function zlist(s){ return String(s || "").split(";").map(x => x.trim()).filter(Boolean); }
function kvPairs(s, sep){
  const out = [];
  zlist(s).forEach(kv => {
    const i = kv.indexOf(sep);
    if(i > 0) out.push([kv.slice(0, i), kv.slice(i + 1)]);
  });
  return out;
}
// 不是所有 "thermal zone" 都报温度 —— 有些是虚拟传感器，temp 里放的是
// 电压(mV) / 电流(mA) / 功率。这些类型直接跳过（
// 也是这么过滤的，我漏抄了，才导致「其他」显示 700 多度）。
const ZONE_SKIP = /vbat|volt|current|power|soc_volt|resistance|capacity|_mv$|_ma$/i;
function zoneIsTemp(type){
  return !ZONE_SKIP.test(String(type || ""));
}
function toC(raw){
  const v = num(raw);
  if(v === null || v <= 0) return null;
  const c = v > 1000 ? v / 1000 : v;
  // 第二道防线：超出合理温度范围的一律当没读到
  if(c < -40 || c > 150) return null;
  return c;
}
function tripC(s){
  const v = num(String(s || "").split("/")[0]);
  if(v === null || v <= 0) return null;
  return v > 1000 ? v / 1000 : v;
}

  t.svcs = {};

  t.ztypes = kvPairs(m.ztypes, ":").map(([n, type]) => ({n, type}))
    .filter(z => zoneIsTemp(z.type))
    .sort((a, b) => (parseInt(a.n, 10) || 0) - (parseInt(b.n, 10) || 0));

  t.loaded = true;

    if(val){
      val.textContent = fmtTemp(c) + tempSuffix();
      val.style.color = c >= 65 ? "var(--red)" : c >= 50 ? "var(--orange)" : "";
    }
    if(bar){
      const trip = tripC(t.ztrips[z.n]);
      const pct = trip ? clamp(c / trip * 100, 0, 100) : clamp(c / 90 * 100, 0, 100);
      bar.style.width = pct.toFixed(1) + "%";
      bar.style.background = pct >= 95 ? "var(--red)" : pct >= 80 ? "var(--orange)" : "var(--blue)";
    }
  });
  setTxt("thBig", tmax === null ? "--" : fmtTemp(tmax) + tempSuffix());
  renderTempCells();
  const ic = $("thIc"), uc = $("thUsb");
  if(ic) ic.textContent = t.chg.input_current_limit || "--";
  if(uc) uc.textContent = t.chg.usb_current_max || "--";
}

/* ---------- 动作 ---------- */
async function thermalBoot(){
  await loadThermal();
  await loadThermalDyn();
  startLoop();
}
async function thAct(act, k1, el){
  const t = thermalState();
  if(t.busy) return;
  if(t.demo){ toast("演示模式：未执行"); return; }
  t.busy = true;
  busy(true, "执行中");
  try{
    if(act === "svc"){
      const name = el.getAttribute("data-k1");
      const go = el.getAttribute("data-k2") === "stop";
      const r = await sh(go + " " + shq(name) + " 2>/dev/null; echo __OK__", 15000);
      toast(r.stdout.indexOf("__OK__") >= 0 ? ("已" + (go ? "停止 " : "启动 ") + name) : "命令没成功");
    }else if(act === "svc-all"){
      const go = k1 === "stop";
      let n = 0;
      for(const s of Object.keys(t.svcs)){
        if((t.svcs[s] === "running") === go){ await sh((go ? "stop " : "start ") + shq(s) + " 2>/dev/null", 8000); n++; }
      }
      toast((go ? "已停掉 " : "已启动 ") + n + " 个温控服务");
    }else if(act === "zone-all"){
      const wantOff = k1 === "off";
      const cmd =
        'o=""; for z in /sys/class/thermal/thermal_zone*; do ' +
        'v=""; IFS= read -r v 2>/dev/null < "$z/mode"; [ -n "$v" ] || continue; ' +
        'case "$v" in disabled|1) cur=off;; *) cur=on;; esac; ' +
        'if [ "' + (wantOff ? "off" : "on") + '" = "$cur" ]; then continue; fi; ' +
        'if [ "$cur" = "on" ]; then { echo disabled > "$z/mode" 2>/dev/null || echo 1 > "$z/mode" 2>/dev/null; } && o="$o-"; ' +
        'else { echo enabled > "$z/mode" 2>/dev/null || echo 0 > "$z/mode" 2>/dev/null; } && o="$o+"; fi; done; echo "n=$o"';
      const r = await sh(cmd, 30000);
      toast((wantOff ? "已禁用 " : "已恢复 ") + (parseKV(r.stdout).n || "").length + " 个 zone");
    }else if(act === "eg-enable"){
      const c = Object.assign(egDefaults(), t.eg || {});
      c.enabled = c.enabled === "1" ? "0" : "1";
      await egWrite(c);
    }else if(act === "eg-item"){
      const c = Object.assign(egDefaults(), t.eg || {});
      c[k1] = c[k1] === "1" ? "0" : "1";
      await egWrite(c);
    }else if(act === "eg-apply" || act === "eg-clear" || act === "eg-gone"){
      // Extreme GT 已从模块移除（这些按钮在新版界面上已经不存在了）
      toast("Extreme GT 已从模块移除");
    }else if(act === "freq"){
      const pct = clamp(parseInt(k1, 10) || 100, 10, 100);
      const cmd =
        'P=' + pct + '; o=""; for d in /sys/devices/system/cpu/cpu*/cpufreq; do ' +
        'm=""; IFS= read -r m 2>/dev/null < "$d/cpuinfo_max_freq"; [ -n "$m" ] || continue; ' +
        't=$((m * P / 100)); echo "$t" > "$d/scaling_max_freq" 2>/dev/null && o="$o+"; done; ' +
        'g=0; for f in /sys/class/kgsl/kgsl-3d0/max_gpuclk /sys/class/devfreq/gpufreq/max_freq; do ' +
        'if [ -f "$f" ]; then c=""; IFS= read -r c 2>/dev/null < "$f"; ' +
        'if [ -n "$c" ]; then n=$((c * P / 100)); echo "$n" > "$f" 2>/dev/null && g=1; fi; break; fi; done; ' +
        'echo "cpu=$o"; echo "gpu=$g"';
      const r = await sh(cmd, 30000);
      const kv = parseKV(r.stdout);
      toast("CPU 上限 → " + pct + "%（" + (kv.cpu || "").length + " 核）" + (kv.gpu === "1" ? " · GPU 同改" : ""));
    }else if(act === "chg"){
      const v = String(k1 || "").replace(/[^0-9]/g, "");
      if(!v) return;
      const cmd =
        'V=' + v + '; o=""; for k in input_current_limit constant_charge_current_max charge_control_limit; do ' +
        '[ -f /sys/class/power_supply/battery/$k ] && echo "$V" > /sys/class/power_supply/battery/$k 2>/dev/null && o="$o$k "; done; ' +
        '[ -f /sys/class/power_supply/usb/current_max ] && echo "$V" > /sys/class/power_supply/usb/current_max 2>/dev/null && o="\${o}usb "; ' +
        'echo "ok=$o"';
      const r = await sh(cmd, 15000);
      const got = (parseKV(r.stdout).ok || "").trim();
      toast(got ? "已限制到 " + (Number(v)/1e6).toFixed(2) + " A（" + got + "）" : "写入失败，机型可能不开放这个节点");
    }
  }catch(e){
    toast("执行失败：" + ((e && e.message) || e));
  }finally{
    busy(false);
    t.busy = false;
  }
  await loadThermal();
  await loadThermalDyn();
}
async function egRun(mode, okMsg){
  const t = thermalState();
  if(!t.egDir){ toast("找不到 bin/eg.sh"); return null; }
  const r = await sh("sh " + shq(t.egDir + "/bin/eg.sh") + " " + mode + " 2>&1", 60000);
  const kv = parseKV(r.stdout);
  if(okMsg) toast(okMsg);
  else if(mode === "apply"){
    const bits = [];
    if(kv.xml_mounted) bits.push("挂载 " + kv.xml_mounted + " 个");
    if(kv.emul_written) bits.push("emul " + kv.emul_written + " 个");
    if(kv.orms) bits.push("ORMS 已停");
    if(kv.horae) bits.push("horae ok");
    toast(bits.length ? "已应用：" + bits.join(" · ") : "已应用");
  }else if(mode === "eg-gone" || mode === "clear") toast("Extreme GT 已从模块移除");
  else toast("已执行");
  return kv;
}
async function egWrite(cfg){
  const t = thermalState();
  const prev = t.eg;
  t.eg = cfg;
  if(t.demo){ renderThermal(); toast("演示模式：未写入"); return; }
  busy(true, "写入 EG 配置");
  try{
    const ok = await dfWriteFile("/data/adb/ksu_toolbox/eg.txt", egText(cfg));
    if(!ok){
      t.eg = prev; renderThermal();
      toast("配置写入失败，已撤销");
      return;
    }
    if(!t.egDir){ toast("找不到 bin/eg.sh"); return; }
    if(cfg.enabled !== "1"){
      await egRun("clear", "已关闭，温度伪装已恢复");
    }else{
      await egRun("apply");
    }
  }finally{ busy(false); }
  await loadThermal();
}

function copyText(s){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(() => toast("已复制"), () => toast("复制失败，手动选一下吧"));
      return;
    }
  }catch(e){}
  const ta = document.createElement("textarea");
  ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制"); }catch(e){ toast("复制失败"); }
  document.body.removeChild(ta);
}

async function runDiag(){
  const box = $("diagBody");
  if(!box) return;
  let raw = "";
  let bridgeOK = true;
  if(thermalState().demo && !HTTPX.active){
    bridgeOK = false;
  }else{
    const r = await sh(DIAG_CMD.join("; "), 30000);
    if(r.stderr === "__NOBRIDGE__") bridgeOK = false;
    else raw = r.stdout;
  }
  const rows = [];
  String(raw).split("\n").forEach(line => {
    const p = line.split("|");
    if(p.length < 4 || p[0] !== "C") return;
    rows.push({name: p[1], st: p[2], detail: p.slice(3).join("|")});
  });
  // 桥能力探针（只在 App / 新版 KernelSU 里有）
  try{
    const b = bridge();
    if(b && typeof b.probe === "function"){
      const o = JSON.parse(b.probe());
      rows.push({name: "PackageManager", st: o.err ? "no" : "ok",
                 detail: o.err || ("已装 " + o.installed + " 个 · 示例名 " + o.sampleLabel)});

      rows.push({name: "PackageManager", st: "warn",

  }catch(e){

  }

  const logs = [];

  const html =
    (bridgeOK ? "" : banner("warn", "当前不是 KernelSU 环境", HTTPX.active ? "通过本地 HTTP 服务读取的都是只读快照。" : "下面是演示数据，真机上会显示实际结果。")) +
    '<div class="section-head"><h2>环境体检</h2><span class="hint">' + rows.filter(r => r.st === "ok").length + " / " + rows.length + " 通过" + '</span></div>' +
    '<section class="card core-list">' + (rows.length ? rows.map(r =>
      '<div class="chk"><span class="ci ' + esc(r.st) + '">' + (r.st === "ok" ? "✓" : r.st === "no" ? "✕" : "!") + '</span>' +
      '<span class="cn">' + esc(r.name) + '</span><span class="cd">' + esc(r.detail) + '</span></div>').join("")
      : '<div class="row"><span>没有拿到检查结果</span><strong>--</strong></div>') + '</section>' +

const UID_NAMES = {
  0: "root", 1000: "system", 1001: "radio", 1002: "bluetooth", 1003: "graphics",
  1004: "input", 1006: "drm", 1007: "log", 1009: "mount", 1010: "wifi",
  1011: "adb", 1013: "media", 1018: "drmrpc", 1020: "dlna", 1021: "gps",
  1023: "media_audio", 1032: "sdcard_rw", 1041: "media_rw", 1047: "sdcard_r",
  1067: "usb", 1077: "external_storage", 1078: "ext_data_rw", 1079: "ext_obb_rw",
  2000: "shell", 2001: "cache", 2002: "diag", 3001: "net_bt_admin",
  3002: "net_bt", 3003: "inet", 3004: "net_raw", 3005: "net_admin",
  3006: "net_bw_stats", 3009: "net_bw_acct", 3010: "readproc", 9999: "nobody"
};
function userName(uid){
  const u = Number(uid);
  if(UID_NAMES[u] !== undefined) return UID_NAMES[u];
  if(u >= 10000 && u < 20000) return "u0_a" + (u - 10000) + "（应用）";
  if(u >= 90000) return "isolated";
  return "uid " + u;
}

async function loadApps(){
  const A = appState();
  A.loadedApps = false;
  renderAppTab();
  if(thermalState().demo){
    A.apps = ["com.tencent.mm", "com.android.chrome", "com.tencent.tmgp.sgame",
              "com.coolapk.market", "com.topjohnwu.magisk", "me.weishu.kernelsu"].map(p => ({pkg: p, sys: false}));
    A.loadedApps = true;
    renderAppTab();
    return;
  }
  const r = await sh("pm list packages -3 2>/dev/null; echo '____'; pm list packages -s 2>/dev/null", 40000);
  const parts = String(r.stdout).split("____");
  const cut = s => String(s || "").split("\n").map(x => x.trim().replace(/^package:/, "")).filter(Boolean);
  const user = cut(parts[0]).map(p => ({pkg: p, sys: false}));
  const sys = cut(parts[1]).map(p => ({pkg: p, sys: true}));

  const all = user.concat(sys);
  A.apps = all;
  A.loadedApps = true;
  A.loadedCount = 0;
  renderAppTab();

  // 应用名：分批问，别一次 400 个把桥堵死
  const b = bridge();
  if(!b || typeof b.getPackagesInfo !== "function"){
    A.labelErr = globalThis.ksu ? "当前 KernelSU 版本没有 getPackagesInfo" : "不在 App / KernelSU 里打开";
  }else{
    A.labelErr = "";
    A.labels = {};
    let got = 0;
    const STEP = 80;
    for(let i = 0; i < all.length; i += STEP){
      const chunk = all.slice(i, i + STEP);
      try{
        const j = b.getPackagesInfo(JSON.stringify(chunk.map(x => x.pkg)));
        const arr = typeof j === "string" ? JSON.parse(j) : j;
        if(Array.isArray(arr)){
          arr.forEach(p => {
            if(p && p.packageName){
              A.labels[p.packageName] = {label: p.appLabel || "", ver: p.versionName || "", uid: p.uid};
              got++;
            }
          });
        }
      }catch(e){ A.labelErr = String((e && e.message) || e); }
      A.loadedCount = Math.min(i + STEP, all.length);
      await new Promise(r => setTimeout(r, 0));
    }
    if(!got && !A.labelErr) A.labelErr = "接口返回了空数组（KernelSU 老版本可能不支持）";
  }
  renderAppTab();
  fetchIcons(appFiltered().slice(0, 150).map(x => x.pkg));
}
/* ── 图标：分批拉，拉到一批就地把字母占位换掉 ── */
async function fetchIcons(pkgs){
  const A = appState();
  const b = bridge();
  if(!b || typeof b.getIcons !== "function"){
    A.iconErr = "当前环境的 WebUI 桥没有 getIcons（只有本模块的桌面 App 提供）";
    renderAppTab();
    return;
  }
  if(A.iconBusy) return;
  const need = pkgs.filter(p => A.icons[p] === undefined);
  if(!need.length) return;
  A.iconBusy = true;
  need.forEach(p => { A.icons[p] = ""; });
  const STEP = 24;
  try{
    for(let i = 0; i < need.length; i += STEP){
      const chunk = need.slice(i, i + STEP);
      try{
        const j = b.getIcons(JSON.stringify(chunk));
        const map = typeof j === "string" ? JSON.parse(j) : j;
        if(map) Object.keys(map).forEach(k => { A.icons[k] = map[k]; });
      }catch(e){ A.iconErr = String((e && e.message) || e); break; }
      paintIcons();
      await new Promise(r => setTimeout(r, 0));
    }
  }finally{
    A.iconBusy = false;
    paintIcons();
  }
}
function paintIcons(){
  const A = appState();
  const nodes = document.querySelectorAll("#amBody [data-ic]");
  for(let i = 0; i < nodes.length; i++){
    const el = nodes[i];
    if(el.dataset.done) continue;
    const src = A.icons[el.getAttribute("data-ic")];
    if(!src) continue;
    el.dataset.done = "1";
    el.innerHTML = '<img src="' + esc(src) + '" alt="">';
  }
}

// 注意：PROC_CMD 各元素会用 "; " 拼成一行执行，所以里面绝不能出现 # 注释。
// 位置映射：R 已去掉 "pid (comm) "，位置1 = state = 字段3 → 位置N ↔ 字段N+2
// 因此 utime(字段14)=${12}、stime(15)=${13}、rss(24)=${22}
const PROC_CMD = [
  'UPT=$(cut -d. -f1 /proc/uptime); [ "$UPT" -gt 0 ] 2>/dev/null || UPT=1',
  'o=""',
  'for d in /proc/[0-9]*; do p=${d#/proc/}; L=""; IFS= read -r L 2>/dev/null < "$d/stat" || continue; [ -n "$L" ] || continue; R=${L##*) }; set -- $R; [ $# -ge 24 ] || continue; st=$1; pp=$2; ut=${12}; stt=${13}; rs=${22}; N=""; IFS= read -r N 2>/dev/null < "$d/comm"; u=""; while IFS= read -r ln; do case "$ln" in Uid:*) for w in $ln; do case "$w" in Uid:*) continue;; esac; u=$w; break; done; break;; esac; done < "$d/status"; o="$o$p,$pp,$u,$st,$ut,$stt,$((rs*4)),$N|"; done',
  'echo "procs=$o"',
  'echo "uptime=$UPT"'
];
async function loadProcs(){
  const A = appState();
  if(A.procLoading) return;
  A.procLoading = true;
  try{
    let kv;
    if(thermalState().demo){
      kv = demoProcs();
    }else{
      const r = await sh(PROC_CMD.join("; "), 40000);
      kv = parseKV(r.stdout);
    }
    const now = Date.now();
    const raw = String(kv.procs || "").split("|").map(x => x.trim()).filter(Boolean);
    const dt = A.prevAt ? (now - A.prevAt) / 1000 : 0;
    const next = {};
    const list = raw.map(line => {
      const f = line.split(",");
      if(f.length < 8) return null;
      const name = f.slice(7).join(",");
      const jiff = (Number(f[4]) || 0) + (Number(f[5]) || 0);
      next[f[0]] = jiff;
      let cpu = null;
      if(dt > 0.2 && A.prevJ[f[0]] !== undefined){
        const d = jiff - A.prevJ[f[0]];
        if(d >= 0) cpu = Math.max(0, d / dt);
      }
      return {pid: Number(f[0]), ppid: Number(f[1]), uid: Number(f[2]), st: f[3],
              jiff, rss: Number(f[6]) || 0, name: name, cpu: cpu};
    }).filter(Boolean);
    if(dt > 0.2){ A.prevJ = next; A.prevAt = now; }
    else if(!A.prevAt){ A.prevJ = next; A.prevAt = now; }
    A.procs = list;
  }finally{
    A.procLoading = false;
    renderAppTab();
  }
}
function demoProcs(){
  const names = ["init", "system_server", "surfaceflinger", "zygote64", "com.android.systemui",
                 "com.tencent.mm", "com.tencent.tmgp.sgame", "kworker/u16:2", "adbd", "logd"];
  const out = names.map((n, i) => {
    const j = 100 + i * 37;
    return [1000 + i * 100, i === 0 ? 0 : 1000, i < 5 ? 1000 : 10000 + i, "S", j, j / 2, 1024 * (i + 3), n].join(",");
  }).join("|");
  return {procs: out + "|", uptime: "12345"};
}
function procFiltered(){
  const A = appState();
  const q = A.procQ.trim().toLowerCase();
  let list = A.procs.slice();
  if(q){
    list = list.filter(p => String(p.pid).indexOf(q) === 0 || p.name.toLowerCase().indexOf(q) >= 0
      || String(p.uid) === q || String(p.ppid) === q);
  }
  const key = A.sort;
  list.sort((a, b) => {
    let x, y;
    if(key === "cpu"){ x = a.cpu === null ? -1 : a.cpu; y = b.cpu === null ? -1 : b.cpu; }
    else if(key === "res"){ x = a.rss; y = b.rss; }
    else if(key === "uid"){ x = a.uid; y = b.uid; }
    else if(key === "pid"){ x = a.pid; y = b.pid; }
    else { x = a.name.toLowerCase(); y = b.name.toLowerCase(); }
    if(x < y) return A.asc ? -1 : 1;
    if(x > y) return A.asc ? 1 : -1;
    return 0;
  });
  return list;
}

async function openProcDetail(pid){
  busy(true, "读取进程 " + pid);
  let kv = {};
  try{
    const r = await sh([
      'P=' + shq(String(pid)),
      '[ -d /proc/$P ] || { echo "gone=1"; exit 0; }',
      'echo "stat=$(base64 < /proc/$P/stat 2>/dev/null | tr -d \'\\n\')"',
      'echo "status=$(base64 < /proc/$P/status 2>/dev/null | tr -d \'\\n\')"',
      'echo "cgroup=$(base64 < /proc/$P/cgroup 2>/dev/null | tr -d \'\\n\')"',
      'echo "cmdline=$(base64 < /proc/$P/cmdline 2>/dev/null | tr -d \'\\n\')"',
      'echo "wchan=$(base64 < /proc/$P/wchan 2>/dev/null | tr -d \'\\n\')"',
      'echo "oom=$(cat /proc/$P/oom_score_adj 2>/dev/null)"',
      'echo "cpuset=$(cat /proc/$P/cpuset 2>/dev/null || cgroup -g cpuset /proc/$P 2>/dev/null | head -1)"',
      'U=$(awk \'/^Uid:/{print $2; exit}\' /proc/$P/status 2>/dev/null); case "$U" in ""|*[!0-9]*) U=0 ;; esac',
      'echo "pkg=$(pm list packages --uid $U 2>/dev/null | head -2 | sed \'s/^package://\' | tr \'\\n\' \' \')"'
    ].join("; "), 40000);
    kv = parseKV(r.stdout);
  }finally{ busy(false); }
  if(kv.gone === "1"){ toast("进程已经不在了"); return; }

  const st = b64utf8Decode(kv.stat || "");
  const stt = b64utf8Decode(kv.status || "");
  const cg = b64utf8Decode(kv.cgroup || "");
  const cmd = b64utf8Decode(kv.cmdline || "").replace(/\0/g, " ").trim();
  const wchan = b64utf8Decode(kv.wchan || "");
  const g = (src, k) => { const m = new RegExp("^" + k + ":\\s*(.+)$", "m").exec(src); return m ? m[1].trim() : ""; };

  const R = st.replace(/^.*?\)\s/, "").split(/\s+/);
  const state = R[0] || "?";
  const ppid = R[1] || "?";
  // 下标换算：去掉 "pid (comm) " 后 index0 = state = 第 3 个字段 → 字段 N 的下标是 N-3
  const utime = Number(R[11]) || 0, stime = Number(R[12]) || 0;
  const rss = (Number(R[21]) || 0) * 4;
  const threads = R[17] || "?";
  const uid = (g(stt, "Uid") || "0").split(/\s+/)[0];
  const vmrss = g(stt, "VmRSS");
  const cpus = g(stt, "Cpus_allowed_list");
  // 兜底：pm 报错时会把 java 异常文本吐出来，只认正经包名
  const rawPkg = String(kv.pkg || "").trim();
  const pkg = /^([A-Za-z0-9_]+\\.)*[A-Za-z0-9_]+$/.test(rawPkg.split(/\\s+/)[0] || "") ? rawPkg.split(/\\s+/)[0] : "";

  // 从列表里拿实时 CPU
  const p = appState().procs.filter(x => x.pid === Number(pid))[0];
  const cpuTxt = p && p.cpu !== null ? p.cpu.toFixed(2) + " %" : "（需要两次采样，稍等再打开）";

  openModal((cmd || g(stt, "Name") || "pid " + pid).split(/\s+/)[0].slice(0, 30), "pid " + pid,
    '<section class="card row-list">' +
      '<div class="row"><span>PID / PPID</span><strong>' + pid + ' / ' + esc(ppid) + '</strong></div>' +
      '<div class="row"><span>用户</span><strong>' + esc(uid) + ' · ' + esc(userName(uid)) + '</strong></div>' +
      (pkg ? '<div class="row"><span>所属应用</span><strong>' + esc(pkg) + '</strong></div>' : '') +
      '<div class="row"><span>CPU</span><strong class="hi">' + esc(cpuTxt) + '</strong></div>' +
      '<div class="row"><span>内存 RSS</span><strong>' + esc(vmrss || (rss + " kB")) + '</strong></div>' +
      '<div class="row"><span>累计 CPU 时间</span><strong>' + ((utime + stime) / 100).toFixed(2) + ' s</strong></div>' +
      '<div class="row"><span>运行状态</span><strong>' + esc(state) + ' · ' + esc(PROC_STATES[state] || "未知") + '</strong></div>' +
      '<div class="row"><span>线程数</span><strong>' + esc(threads) + '</strong></div>' +
      '<div class="row"><span>cpus_allowed</span><strong>' + esc(cpus || "--") + '</strong></div>' +
      '<div class="row"><span>wchan</span><strong>' + esc(wchan || "--") + '</strong></div>' +
      '<div class="row"><span>oom_score_adj</span><strong>' + esc(kv.oom || "--") + '</strong></div>' +
      '<div class="row"><span>cpuset</span><strong>' + esc(String(kv.cpuset || "--").replace(/\n/g, " ").slice(0, 80)) + '</strong></div>' +
    '</section>' +
    '<div class="section-head" style="margin-top:4px"><h2>cgroup</h2></div>' +
    '<div class="logbox" style="max-height:20vh">' + esc(cg || "(空)") + '</div>' +
    (cmd ? '<div class="section-head" style="margin-top:6px"><h2>命令行</h2></div><div class="logbox" style="max-height:14vh">' + esc(cmd) + '</div>' : ''),
    '<button class="ghost" data-act="pr-trace">跟踪它</button>' +
    '<button class="ghost" data-act="pr-refresh">刷新</button>' +
    '<button class="danger" data-act="pr-kill">停止 (kill -9)</button>');
  const f = $("modalFooter");
  f.querySelector('[data-act="pr-refresh"]').onclick = () => openProcDetail(pid);
  f.querySelector('[data-act="pr-trace"]').onclick = () => traceProc(pid, cmd || g(stt, "Name"));
  f.querySelector('[data-act="pr-kill"]').onclick = () => killProc(pid, cmd || g(stt, "Name"));
}
function killProc(pid, name){
  openModal("确认停止", "pid " + pid,
    banner("danger", "kill -9 " + (name || pid) + "？", "SIGKILL 不给进程任何清理机会。系统关键进程被停掉会导致界面重启甚至软重启 —— 确认你杀的是对的那个。"),
    '<button data-act="no">取消</button><button class="danger" data-act="yes">确认停止</button>');
  const f = $("modalFooter");
  f.querySelector('[data-act="no"]').onclick = closeModal;
  f.querySelector('[data-act="yes"]').onclick = async () => {
    closeModal();
    if(thermalState().demo){ toast("演示模式：未执行"); return; }
    const r = await sh("kill -9 " + Number(pid) + " 2>&1; echo rc=$?", 15000);
    logOp("kill -9 " + pid + " (" + (name || "") + ")");
    toast(/rc=0/.test(r.stdout) ? "已发送 SIGKILL" : ("失败：" + r.stdout.slice(0, 60)));
    await loadProcs();
  };
}
async function traceProc(pid, name){
  const A = appState();
  if(A.traceTimer){ clearInterval(A.traceTimer); A.traceTimer = 0; }
  A.trace = pid;
  openModal("跟踪 " + (name || pid), "pid " + pid + " · 实时 logcat",
    banner("warn", "这是 logcat，不是 strace", "Android 上没自带 strace，看不到具体的 syscall 序列。这里抓的是该进程自己往 logcat 写的东西 + 它当前阻塞在哪（wchan）。手机上够用。") +
    '<div class="section-head" style="margin-top:4px"><h2>当前状态</h2></div>' +
    '<div class="row-list" id="traceStat"></div>' +
    '<div class="section-head" style="margin-top:6px"><h2>日志（最近 60 行，每 2 秒刷）</h2></div>' +
    '<div class="logbox" id="traceLog" style="max-height:34vh">读取中…</div>',
    '<button class="ghost" data-act="tr-stop">停止跟踪</button>');
  $("modalFooter").querySelector('[data-act="tr-stop"]').onclick = stopTrace;
  const tick = async () => {
    if(A.trace !== pid) return;
    const r = await sh([
      'P=' + Number(pid),
      '[ -d /proc/$P ] || { echo "gone=1"; exit 0; }',
      'echo "wchan=$(cat /proc/$P/wchan 2>/dev/null)"',
      'echo "syscall=$(cat /proc/$P/syscall 2>/dev/null | cut -d\\  -f1)"',
      'echo "state=$(awk \'{print $3}\' /proc/$P/stat 2>/dev/null)"',
      'echo "log=$(logcat -d --pid=$P -t 60 2>/dev/null | tail -60 | base64 | tr -d \'\\n\')"'
    ].join("; "), 25000);
    const kv = parseKV(r.stdout);
    if(kv.gone === "1"){ stopTrace(); toast("进程结束了"); return; }
    const s = $("traceStat");
    if(s) s.innerHTML =
      '<div class="row"><span>状态</span><strong>' + esc(kv.state || "?") + ' · ' + esc(PROC_STATES[kv.state] || "") + '</strong></div>' +
      '<div class="row"><span>阻塞在</span><strong>' + esc(kv.wchan || "--") + '</strong></div>' +
      '<div class="row"><span>当前 syscall</span><strong>' + esc(kv.syscall || "--") + '</strong></div>';
    const l = $("traceLog");
    if(l){
      const t = b64utf8Decode(kv.log || "");
      l.textContent = t.trim() || "(这个进程没往 logcat 写东西)";
      l.scrollTop = l.scrollHeight;
    }
  };
  await tick();
  A.traceTimer = setInterval(tick, 2000);
}
function stopTrace(){
  const A = appState();
  if(A.traceTimer){ clearInterval(A.traceTimer); A.traceTimer = 0; }
  A.trace = null;
  closeModal();
}

async function handleAppAct(act, k1){
  const A = appState();
  if(act === "open") return openAppDetail(k1);
  if(act === "proc") return openProcDetail(Number(k1));
  if(act === "reload"){
    if(A.mode === "apps") await loadApps(); else await loadProcs();
    return;

  if(act === "mode-sys"){ A.sysApps = k1 === "1"; renderAppTab(); return; }

/* ============================================================
 *  11.7 受保护的执行（ptrace 监督）
 *  不是沙箱、不是虚拟机 —— 同权限下用 ptrace 盯着它，
 *  在危险 syscall 执行【之前】拦下来。
 *    · 对 raw syscall 写的样本有效（比 LD_PRELOAD 强得多）
 *    · 但目标若有反调试能识破 —— 不保证 100%
 * ============================================================ */
const GUARD_LOG = "/data/local/tmp/ksu_guard.log";
const GUARD_RUN_LOG = "/data/local/tmp/ksu_guard_run.log";
function guardState(){
  if(!state.guard) state.guard = {mode:"watch", reads:true, last:""};
  if(!state.guard.limit) state.guard.limit = 60;
  return state.guard;
}
/* 核心原则：桥是【同步阻塞】的 —— ksu.exec 期间整个 JS 线程冻住。
   所以任何超过几百毫秒的命令都不能直接 await，否则界面直接卡死。
   做法：后台起进程，立刻返回；然后用极短的 tail 轮询日志。 */
async function guardRun(){
  const G = guardState();
  if(G.running){ toast("还在跑，点下面的「解锁界面」可以停"); return; }
  const el = $("guardTarget");
  const target = ((el && el.value) || "").trim();
  if(!target){ toast("先填要跑的东西"); return; }
  G.last = target;
  if(thermalState().demo){ toast("演示模式：未执行"); return; }

  const kill = G.mode === "kill";
  const tmo = G.limit || 60;
  G.running = true; G.off = 0; G.hits = 0; G.anti = false; G.busy = false; G.t0 = Date.now();
  G.launchShown = false;
  const btn = $("guardRun");
  if(btn){ btn.disabled = true; btn.textContent = "执行中…"; }
  busy(true, "已后台启动…");

  // 真正干活的那段（全部塞进一个后台 sh 里）
  const inner = [
    'B=""',
    'for c in /data/adb/modules/ksu_toolbox/bin/ksu_guard /data/adb/modules_update/ksu_toolbox/bin/ksu_guard /data/adb/modules/ksu_toolbox-update/bin/ksu_guard; do',
    '  if [ -x "$c" ]; then B="$c"; break; fi',
    'done',
    'if [ -z "$B" ]; then',
    '  echo "!! 找不到 ksu_guard"',
    '  echo "!! /data/adb/modules/ksu_toolbox/bin/ksu_guard 不存在或不可执行"',
    '  ls -la /data/adb/modules/ksu_toolbox/bin/ 2>&1 | head -20',
    '  echo "退出码=9"; exit 9',
    'fi',
    'echo "[*] 用 $B"',
    'T=' + shq(target),
    'CMD="$T"',
    'if [ -f "$T" ]; then',
    '  case "$T" in /sdcard/*|/storage/*|/mnt/*) cp -f "$T" /data/local/tmp/_guard_tgt >/dev/null 2>&1 && T=/data/local/tmp/_guard_tgt ;; esac',
    '  chmod 755 "$T" >/dev/null 2>&1',
    '  if [ "$(head -c 4 "$T" 2>/dev/null | od -An -tx1 | tr -d \' \\n\')" = "7f454c46" ]; then CMD="$T"; else CMD="sh $T"; fi',
    '  echo "[*] 实际跑: $CMD"',
    'fi',
    ': > ' + shq(GUARD_LOG),
    /* -t 让 guard 自己的看门狗跟这边的 timeout 对齐。
       ⚠ 结尾【不再】tail guard 日志：
         终端那边是逐行流式跟进的，再 dump 一遍就会"点一次出两份日志"。 */
    'timeout ' + (tmo + 10) + ' "$B"' + (kill ? "" : " -w") + (G.reads ? "" : " -r") + " -t " + tmo + " -l " + shq(GUARD_LOG) + ' -- sh -c "$CMD"',
    'echo "退出码=$?"'
  ].join("\n");

  // 启动命令本身也是短的：nohup ... & 之后立刻 echo 返回
  const launch = "nohup sh -c " + shq(inner) + " >> " + shq(GUARD_RUN_LOG) + " 2>&1 < /dev/null & echo 已启动";
  try{
    await sh(": > " + shq(GUARD_RUN_LOG) + "; " + launch, 10000);
  }catch(e){}
  termAppendBlock([["sys", "受保护的执行（" + (kill ? "拦截并杀死" : "先观察") + " · 时限 " + tmo + "s）: " + target]]);
  busy(false);
  setGuardStat("● 已启动 · 0s · 命中 0 次", "on");
  pollGuard();
}

/* 运行状态条（那行小字） */
function setGuardStat(txt, cls){
  const el = $("guardStat");
  if(!el) return;
  if(!txt){ el.style.display = "none"; el.textContent = ""; el.className = "guard-stat"; return; }
  el.style.display = "";
  el.className = "guard-stat" + (cls ? " " + cls : "");
  el.textContent = txt;
}

/* 轮询：只读【新增】的日志行，逐行追加到终端。
   —— 旧版是 tail -n 250 整块替换 + 只渲染最后 120 行：
      日志一超过那个窗口，前面的拦截记录就被顶掉了，
      用户只看得到最早一条，后面全得手动点「看日志」。
   现在拿行号当游标（G.off），每轮最多捞 60 行追加，一条都不会丢。 */
function pollGuard(){
  const G = guardState();
  const fin = (msg) => {
    clearTimeout(G.pollTimer); G.pollTimer = 0; G.running = false; G.busy = false;
    const b = $("guardRun"); if(b){ b.disabled = false; b.textContent = "受保护的执行"; }
    if(msg) termAppendBlock([["err", msg]]);
  };
  clearTimeout(G.pollTimer);
  G.pollTimer = setTimeout(async () => {
    if(!G.running) return;
    if(G.busy){ pollGuard(); return; }        // 上一轮还在等桥，别叠起来
    G.busy = true;
    const off = G.off | 0;
    let out = "";
    try{
      const r = await sh(
        'L=' + shq(GUARD_LOG) + '; R=' + shq(GUARD_RUN_LOG) + '; ' +
        'n=$(wc -l < "$L" 2>/dev/null || echo 0); echo "@@N $n"; ' +
        'if [ "$n" -gt ' + off + ' ]; then tail -n +' + (off + 1) + ' "$L" | head -n 60; fi; ' +
        'echo "@@RUN"; tail -n 30 "$R" 2>/dev/null; ' +
        'pgrep -f ksu_guard >/dev/null 2>&1 && echo "@@ALIVE 1" || echo "@@ALIVE 0"', 14000);
      out = String(r.stdout || "");
    }catch(e){}
    G.busy = false;
    if(!G.running) return;

    let phase = 0, newLines = [], runLines = [], alive = false;
    for(const L of out.split("\n")){
      if(L.indexOf("@@N ") === 0){ phase = 1; continue; }
      if(L === "@@RUN"){ phase = 2; continue; }
      if(L.indexOf("@@ALIVE") === 0){ alive = /1$/.test(L); phase = 3; continue; }
      if(L === "") continue;
      if(phase === 1) newLines.push(L);
      else if(phase === 2) runLines.push(L);
    }
    if(newLines.length){
      G.off += newLines.length;
      const joined = newLines.join("\n");
      G.hits += (joined.match(/!!/g) || []).length;
      if(joined.indexOf("[反调试]") >= 0) G.anti = true;
      termAppendBlock(newLines.map(L => [(/!!/.test(L) ? "err" : "ok"), L]));
    }
    const secs = Math.round((Date.now() - G.t0) / 1000);
    const done = runLines.some(L => /退出码=/.test(L));

    // 用哪个 guard、实际跑的是什么 —— 第一轮就露个脸（免得等到结束才知道）
    if(!G.launchShown){
      const ls = runLines.filter(L => /^\[\*\]/.test(L));
      if(ls.length){ G.launchShown = true; termAppendBlock(ls.map(L => ["sys", L])); }
    }

    if(done){
      // 只回显驱动器自己的结论行（退出码 / 找不到 guard）
      // —— guard 的日志上面已经实时滚过一遍了，不能再 dump 第二份
      const own = runLines.filter(L => /^退出码=|^!!/.test(L));
      if(own.length) termAppendBlock(own.slice(-6).map(L => [/^退出码=[1-9]|^!!/.test(L) ? "err" : "sys", L]));
      const mm = /退出码=(-?\d+)/.exec(runLines.join("\n"));
      const rc = mm ? parseInt(mm[1], 10) : -1;
      const cut = (rc === 4);          // 4 = guard 到时限收工，不是目标自己结束
      setGuardStat("● 已结束 · 用时 " + secs + "s · 命中 " + G.hits + " 次" +
                   (cut ? " · 到时限掐断" : "") + (G.anti ? " · 有反调试迹象" : ""),
                   (cut || G.anti) ? "warn" : "on");
      if(G.anti){
        // 反 hook 的样本会去查 TracerPid / 关 dumpable，一发现被跟踪就装死或退出
        openModal("⚠️ 这个文件可能有防 hook", "不推荐执行",
          banner("danger", "检测到反调试行为",
            "它在运行期间检查了是否被跟踪（读 /proc/self/status 找 TracerPid、" +
            "prctl(PR_SET_DUMPABLE,0)、或者直接调 ptrace）。") +
          '<section class="card row-list">' +
            '<div class="row"><span>意味着</span><strong>它知道自己被监督了</strong></div>' +
            '<div class="row"><span>可能的表现</span><strong>立刻退出 / 装死 / 换另一条路动手</strong></div>' +
            '<div class="row"><span>建议</span><strong class="danger">不要执行，先在隔离环境里看</strong></div>' +
          '</section>' +
          '<p class="field-hint">不要以为「它退出了 = 它没干坏事」—— 它可能只是先撤，等你放开再动手。</p>',
          '<button data-act="ok">知道了</button>');
        $("modalFooter").querySelector('[data-act="ok"]').onclick = closeModal;
      } else if(cut){
        termAppendBlock([["err", "…到时限被掐断了（不是它自己结束的）—— 上面的日志不是完整结论。把「时限」调长再跑一遍"]]);
      } else if(rc === 9){
        termAppendBlock([["err", "…找不到 ksu_guard —— 模块没装好？点「看日志」看看它 ls 出来的目录"]]);
      } else if(!G.hits){
        termAppendBlock([["err", "…它跑完了，一次危险行为都没碰到。要么它真的干净，要么它反 hook 完就撤了 —— 拿不准就别信它"]]);
      }
      if(G.off > 24){
        termAppendBlock([["sys", "（这次日志有 " + G.off + " 行 —— 终端只保留最近的那部分，完整内容点上面「看日志」）"]]);
      }
      toast(G.anti ? "检测到反调试迹象，见弹窗"
           : cut ? "到时限收工，结论不完整"
           : rc === 9 ? "没找到 ksu_guard"
           : (G.hits ? ("抓到 " + G.hits + " 处危险行为，全在终端里") : "跑完了，没发现危险行为"));
      fin(); return;
    }

    setGuardStat((alive ? "● guard 在跑" : "○ guard 进程没了") + " · " + secs + "s · 命中 " + G.hits + " 次", alive ? "on" : "warn");
    if(secs > tmo + 30){
      fin("…超过时限还没结束，先不等了。去终端 ps -A | grep ksu_guard 看看，或者点「停掉后台」");
      return;
    }
    pollGuard();
  }, 1000);
}

function guardInit(){

    : "范围：只拦对 /dev/block 的写，读放行（要备份 boot 镜像的话用这个）。";
  if(h) h.textContent = (kill
      ? "拦截模式：命中就 SIGKILL 整个进程组。"
      : "观察模式：只记录不拦 —— 先用它跑一遍看清行为，再决定要不要动刀。")
    + scope + " 不保证 100%：同权限下 ptrace 能被反调试识破，真可疑的东西请先在备用机上跑。";
  const run = $("guardRun"); if(run) run.onclick = guardRun;
  const lg = $("guardShowLog"); if(lg) lg.onclick = guardShowLog;
  const rs = $("guardReset"); if(rs) rs.onclick = guardReset;
  const gs = $("guardStop"); if(gs) gs.onclick = guardStop;
  const pm = $("guardPerm");
  if(pm){
    pm.textContent = G.reads ? "读写全拦" : "只拦写";
    pm.style.background = G.reads ? "color-mix(in srgb,var(--orange) 16%,transparent)" : "";
    pm.style.color = G.reads ? "var(--orange)" : "";
    pm.onclick = function(){ G.reads = !G.reads; guardInit(); };
  }
  const pk = $("guardPick");
  if(pk) pk.onclick = function(){ const i = $("termInput"); if(i && i.value) $("guardTarget").value = i.value; else toast("终端输入框是空的"); };
  const tg = $("guardTarget"); if(tg && !tg.value && G.last) tg.value = G.last;
  const lim = $("guardLimit");
  if(lim){
    lim.textContent = "时限 " + (G.limit || 60) + "s";
    lim.onclick = function(){
      const seq = [30, 60, 120, 300];
      const i = seq.indexOf(G.limit || 60);

      guardInit();
      toast("单次执行上限 " + G.limit + " 秒（观察模式跑大文件可以调长点）");
    };
  }
  if(!G.running) setGuardStat("");
}

async function thZones(){

  t.zonesAt = now;
  const out = await thRun("zones", 30000);
  const rows = [];
  let hot = 0;
  out.split("\n").forEach(function(L){
    const p = L.split("|");
    if(p.length < 3 || !p[0]) return;

    rows.push('<div class="row"><span>' + esc(p[0].replace("thermal_zone","z")) + ' · ' + esc(p[1]) + '</span><strong' + c + '>' + (isNaN(temp) ? "—" : (temp/1000).toFixed(1) + "℃") + '</strong></div>');
  });
  const el = $("thBody");

  const h = $("thHint"); if(h) h.textContent = rows.length ? (rows.length + " 个热区" + (hot ? " · " + hot + " 个偏热" : "")) : "只读";
}

/* ============================================================

async function gaLoad(){

async function gaSet(key, val){

/* ============================================================
 *  11.7b 刷新率锁定
 *  后端 bin/refresh.sh：扫描档位 / 锁定+保活 / 恢复原值
 * ============================================================ */
const RR_DIR = "/data/adb/ksu_toolbox/refresh";
function rrBin(){
  return 'B=""; for c in /data/adb/modules_update/ksu_toolbox/bin/refresh.sh /data/adb/modules/ksu_toolbox/bin/refresh.sh /data/adb/modules/ksu_toolbox-update/bin/refresh.sh; do [ -f "$c" ] && { B="$c"; break; }; done; [ -z "$B" ] && { echo "@@NOBIN"; exit 9; }; ';
}
function rrState(){
  if(!state.rr) state.rr = {rates:[], modes:{}, curPeak:"", curMin:"", curMode:"", hz:"", enabled:"", keep:"", reverts:"", ready:false};
  return state.rr;
}
async function rrRun(args, ms){
  if(thermalState().demo){ toast("演示模式：未执行"); return "@@DEMO"; }
  try{
    const r = await sh(rrBin() + 'sh "$B" ' + args + " 2>&1", ms || 25000);
    return String(r.stdout || "");
  }catch(e){ return "ERR " + ((e && e.message) || e); }
}
function rrRatesHTML(){
  const p = rrState();
  if(!p.rates.length) return '<span class="field-hint" style="margin:0">还没有档位 —— 点左边「扫描档位」</span>';
  return p.rates.map(function(hz){
    const on = String(p.hz) === String(hz);
    return '<button class="chip-btn" data-rr="' + esc(hz) + '"' + (on ? ' style="background:var(--blue-soft);color:var(--blue)"' : '') + '>' + esc(hz) + 'Hz' + (on ? ' ✓' : '') + '</button>';
  }).join("");
}
function rrPaint(){
  const p = rrState();
  const host = $("rrRates");
  if(host){
    host.innerHTML = rrRatesHTML();
    host.querySelectorAll("[data-rr]").forEach(function(b){
      b.onclick = function(){ rrLock(b.dataset.rr); };
    });
  }
  const sc = $("rrScan"); if(sc) sc.onclick = rrScan;
  const rs = $("rrRestore"); if(rs) rs.onclick = rrRestore;
  const lg = $("rrLog"); if(lg) lg.onclick = rrLog;
  const hint = $("rrHint");
  if(hint) hint.textContent = p.enabled === "1" ? ("已锁定 " + p.hz + "Hz" + (p.keep === "1" ? " · 保活中" : " · 保活没跑")) : "未锁定";
}
function rrShowStat(){
  const p = rrState(), el = $("rrStat");
  if(!el) return;
  const bits = [];
  if(p.rates.length) bits.push("档位：" + p.rates.join(" / ") + " Hz");
  if(p.curPeak || p.curMin) bits.push("当前 peak=" + (p.curPeak || "?") + " min=" + (p.curMin || "?"));
  if(p.enabled === "1"){
    bits.push("锁定中：" + p.hz + "Hz" + (p.mode ? "（modeId " + p.mode + "）" : ""));
    bits.push(p.keep === "1" ? "保活：在跑" : "保活：没跑");
    if(p.reverts && p.reverts !== "0") bits.push("⚠ 被改回去 " + p.reverts + " 次（有别的组件在动它）");
  } else {
    bits.push("未锁定");
  }
  el.textContent = bits.join(" · ");
}
function rrApplyScan(out){
  const p = rrState();
  out.split("\n").forEach(function(L){
    const i = L.indexOf("="); if(i < 0) return;
    const k = L.slice(0, i), v = L.slice(i + 1).trim();
    if(k === "rates"){ p.rates = v ? v.split(",").map(function(x){ return String(parseInt(x,10) || x); }) : []; }
    else if(k === "modes"){
      p.modes = {};
      v.split(/\s+/).forEach(function(pair){ const q = pair.split("="); if(q.length === 2) p.modes[q[0]] = q[1]; });
    }
    else if(k === "cur_peak") p.curPeak = v;
    else if(k === "cur_min") p.curMin = v;
    else if(k === "cur_mode") p.curMode = v;
  });
  p.ready = true;
}
async function rrScan(){
  busy(true, "扫描刷新率档位…");
  let out = "";
  try{ out = await rrRun("scan", 30000); }catch(e){ out = "ERR " + ((e && e.message) || e); }
  busy(false);
  if(out.indexOf("@@NOBIN") >= 0){ toast("找不到 bin/refresh.sh —— 模块没装全？"); return; }
  rrApplyScan(out);
  rrPaint(); rrShowStat();
  const p = rrState();
  toast(p.rates.length ? ("扫到 " + p.rates.length + " 个档位：" + p.rates.join("/") + "Hz") : "没扫到档位（这台机器的 dumpsys display 可能没给模式表）");
}
async function rrLock(hz){
  const p = rrState();
  if(String(p.hz) === String(hz) && p.enabled === "1"){ toast("已经是这一档了"); return; }
  busy(true, "锁定 " + hz + "Hz…");
  let out = "";
  try{ out = await rrRun("lock " + hz + (p.modes[hz] ? " " + p.modes[hz] : ""), 35000); }catch(e){ out = "ERR " + ((e && e.message) || e); }
  busy(false);
  toast(String(out).trim().slice(0, 80) || ("已锁定 " + hz + "Hz"));
  await rrStatus();
}
async function rrRestore(){
  busy(true, "还原中…");
  let out = "";
  try{ out = await rrRun("restore", 35000); }catch(e){ out = "ERR " + ((e && e.message) || e); }
  busy(false);
  toast(String(out).trim().slice(0, 80) || "已还原");
  const p = rrState(); p.hz = ""; p.enabled = ""; p.keep = ""; p.reverts = "";
  rrPaint(); rrShowStat();
}
async function rrStatus(){
  let out = "";
  try{ out = await rrRun("status", 20000); }catch(e){ out = ""; }
  const p = rrState();
  out.split("\n").forEach(function(L){
    const i = L.indexOf("="); if(i < 0) return;
    const k = L.slice(0, i).trim(), v = L.slice(i + 1).trim();
    if(k === "hz") p.hz = v;
    else if(k === "mode") p.mode = v;
    else if(k === "enabled") p.enabled = v;
    else if(k === "keep") p.keep = v;
    else if(k === "reverts") p.reverts = v;
    else if(k === "cur_peak") p.curPeak = v;
    else if(k === "cur_min") p.curMin = v;
  });
  // 档位文件（后端扫描时会写一份，App 的面板也读它）
  if(!p.rates.length){
    try{
      const r = await sh("cat " + shq(RR_DIR + "/rates") + " 2>/dev/null", 12000);
      const t = String(r.stdout || "").trim();
      if(t) p.rates = t.split(",").map(function(x){ return String(parseInt(x,10) || x); });
    }catch(e){}
  }
  p.ready = true;
  rrPaint(); rrShowStat();
}

/* ============================================================
 *  11.8 迷你监视器悬浮窗
 *
 *  悬浮窗本身是桌面 App 画的（TYPE_APPLICATION_OVERLAY），
 *  这里只负责用 root 发启动 / 停止指令。
 * ============================================================ */
const MON_PKG = "com.jeteezntmax.toolbox";
const MON_STOP_ACTION = MON_PKG + ".STOP_MONITOR";

async function monCheck(){
  const h = $("monHint");
  let installed = false;
  try{
    const r = await sh("pm list packages " + MON_PKG + " 2>/dev/null", 15000);
    installed = String(r.stdout || "").indexOf("package:" + MON_PKG) >= 0;
  }catch(e){}
  if(h) h.textContent = installed
    ? "已装桌面 App。悬浮窗显示什么、什么颜色、放在哪，都在下面调 —— 保存后 2 秒内生效。权限已由 root 自动给，不用手动点。"
    : "还没装桌面 App —— 去「设置 → 桌面 App」装一下再来。";
  return installed;
}
async function monOpen(){
  if(thermalState().demo){ toast("演示模式：未执行"); return; }
  if(!(await monCheck())) return;
  busy(true, "正在启动悬浮窗");
  try{
    const r = await sh("am start -n " + MON_PKG + "/.MonitorActivity 2>&1", 25000);
    const out = String(r.stdout || "").trim();
    if(/Error|Exception|does not exist/i.test(out))
      toast("启动失败：" + out.slice(0, 90));
    else
      toast("已发送启动指令 —— 第一次会要「显示在其他应用上层」权限");
  }catch(e){
    toast("出错：" + ((e && e.message) || e));
  }finally{ busy(false); }
}
async function monClose(){
  if(thermalState().demo){ toast("演示模式：未执行"); return; }
  let out = "";
  try{
    let r = await sh("am startservice -n " + MON_PKG + "/.MonitorService -a " + MON_STOP_ACTION + " 2>&1", 20000);
    out = String(r.stdout || "").trim();
    if(/Error|Exception|not found|Unknown/i.test(out)){
      r = await sh("am start-foreground-service -n " + MON_PKG + "/.MonitorService -a " + MON_STOP_ACTION + " 2>&1", 20000);
      out = String(r.stdout || "").trim();
    }
  }catch(e){}
  if(/Error|Exception/i.test(out)) toast("关不掉就别用指令了 —— 长按悬浮窗直接关，或者点通知里的「停止」");

/* ---- 检测更新：直接 fetch，不走 shell（Android 上没有 curl/wget） ---- */
const UPDATE_JSON = "https://cdn.jsdelivr.net/gh/jeteezntmax/Kernelsu-Toolbox-JeTeeZnTmax@main/update.json";
const CHG_LOG = "/data/local/tmp/chg-probe.txt";
const CHG_SH = "/data/adb/modules/ksu_toolbox/bin/chg.sh";

function chgCmd(){
  return 'B=""; for c in ' + CHG_SH + ' /data/adb/modules_update/ksu_toolbox/bin/chg.sh; do [ -f "$c" ] && B="$c" && break; done; ' +
         '[ -z "$B" ] && { echo "nodir"; exit 1; }; sh "$B" ';
}
async function chgRun(args, timeout){
  if(thermalState().demo){ toast("演示模式：未执行"); return "demo"; }
  const r = await sh(chgCmd() + args + " 2>&1", timeout || 25000);
  return String(r.stdout || "").trim();
}
async function chgStatus(){
  const st = $("chgStatus"), hint = $("chgCapHint");
  if(!st) return;
  const raw = await chgRun("status");
  if(raw === "nodir"){ if(hint) hint.textContent = "没找到 chg.sh"; return; }
  const kv = parseKV(raw);
  const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
  const cap = num(kv.cap, 0);
  const volt = num(kv.volt, 0) / 1e6;
  const cur = Math.abs(num(kv.curr, 0)) / 1000;
  const watt = volt * cur / 1000;
  const temp = num(kv.temp, 0) / 10;
  // 状态：直接报 battery/status 的真话。
  // 以前拿 mmi_charging_enable 猜 ✗ —— 有些机型那个节点语义不对/不更新，
  // 结果明明在 34W 充电却一直显示"已停充" ✗
  const ST_CN = { charging:"充电中", discharging:"放电中", full:"已充满",
                  "not charging":"未充电（可能被限制）" };
  const statRaw = String(kv.stat || "").trim();
  const statCn = ST_CN[statRaw.toLowerCase()] || statRaw || "--";
  const up = String(kv.limit || "").split(",");
  const limOn = up.length >= 5 && up[2] === "1";
  const limVal = up.length >= 5 ? up[3] : "--";
  // 以【我们自己的配置】为准（节点那套很多机型不生效 ✗，看它反而误导）
  const wantLim = parseInt(kv.want_stop || "0", 10) || 0;      // 停充阈值
  const wantIcl = parseInt(kv.want_speed || "0", 10) || 0;     // 调速值（µA）
  const watching = kv.guard === "1";                            // 守护在不在跑
  const myCtx = kv.ctx || "";
  // 上限滑条跟着真实节点走（不然界面和实际不一致）
  { const sl = $("chgLimit"), vl = $("chgLimitVal");
    if(sl && up.length >= 5 && document.activeElement !== sl){
      const v = Math.max(0, Math.min(100, parseInt(up[3] || "80", 10) || 80));
      sl.value = v; if(vl) vl.textContent = v + "%";
    } }
  // 限流滑条跟着【写入用的那个节点】走 —— 以前用 usb/current_max 初始化，
  // 跟写入节点不是同一个 → 写完一刷新就跳回 2000mA ✗
  { const sl = $("chgIcl"), vl = $("chgIclVal");
    // 来源优先级：我们这次设过的（state.iclIntent）→ conf 里的目标 → 节点现值
    // （以前只看后两者，链路一有问题就跳回旧值 ✗）
    const iclSrc = state.iclIntent || wantIcl || num(kv.icl, 0);
    if(sl && iclSrc && document.activeElement !== sl){
      const mA = Math.max(0, Math.min(22000, Math.round(iclSrc / 1000)));
      sl.value = mA; if(vl) vl.textContent = mA + " mA";
    } }
  st.dataset.slow = String(kv.slow || "").split(",")[0] === "1" ? "1" : "0";
  st.innerHTML =
    '<div class="row"><span>状态</span><strong class="' + (/charg|full/i.test(statRaw) ? "ok" : "warn") + '">' +
      esc(statCn) + '</strong></div>' +
    '<div class="row"><span>电量</span><strong>' + cap.toFixed(0) + '%</strong></div>' +
    '<div class="row"><span>功率</span><strong>' + watt.toFixed(2) + ' W（' + volt.toFixed(2) + 'V · ' + cur.toFixed(0) + 'mA）</strong></div>' +
    '<div class="row"><span>温度</span><strong>' + temp.toFixed(1) + ' ℃</strong></div>' +
    '<div class="row"><span>充电保护</span><strong class="' + (wantLim ? "ok" : "") + '">' +
      (wantLim
        ? ("达 " + wantLim + "% 停 · 低 " + (kv.want_recover || 70) + "% 恢复" + (watching ? "（守护 ✓）" : "（守护没跑 ⚠）"))
        : "未开") + '</strong></div>' +
    '<div class="row"><span>适配器</span><strong>' + esc((num(kv.apwr,0)/1000).toFixed(1)) + ' W</strong></div>';
  const iclShow = state.iclIntent || wantIcl || num(kv.icl, 0);
  if(hint) hint.textContent = (myCtx ? ("[" + myCtx.split(":")[2] + "] ") : "") + "已连上 · " +
    (iclShow ? ("目标限流 " + (iclShow/1000).toFixed(0) + "mA" +
                (num(kv.icl,0) && Math.abs(num(kv.icl,0) - iclShow) > 1000 ? "（节点 " + (num(kv.icl,0)/1000).toFixed(0) + "mA ✗）" : "")) : "未设限流") +
    (watching ? " · 监控中 ✓" : "");
}
async function chgAct(label, args, done){
  busy(true, label);
  try{
    const out = await chgRun(args, 30000);
    if(out === "demo") return;
    if(/unsupported/.test(out)) toast("你这台不支持这一项（节点不存在或只读）");
    else if(/write-fail/.test(out)) toast("写失败 —— 节点不可写或被 SELinux 拦了");
    else if(/bad-arg/.test(out)) toast("参数不对");
    else toast((done || "好了") + "：" + out.slice(0, 70));
  }catch(e){ toast("出错：" + ((e && e.message) || e)); }
  finally{ busy(false); }
  await chgStatus();
}


async function fetchTO(url, ms){
  const ac = new AbortController();
  const timer = setTimeout(() => { try{ ac.abort(); }catch(e){} }, ms || 15000);
  try{ return await fetch(url, {cache: "no-store", signal: ac.signal}); }
  finally{ clearTimeout(timer); }
}
async function checkUpdate(){
  busy(true, "检查更新中…");
  let j = null;
  let mi = state.mi || {};
  if(!mi.version && !mi.versionCode){
    try{
      const b = bridge();
      if(b && typeof b.moduleInfo === "function"){
        mi = JSON.parse(b.moduleInfo()) || {};
        state.mi = mi;
      }
    }catch(e){}
  }
  if(!mi.version && !mi.versionCode){
    busy(false);
    toast("读不到模块信息 —— 请在 KernelSU 里打开这个界面");
    return;
  }
  try{
    const res = await fetchTO(UPDATE_JSON + "?t=" + Date.now(), 20000);
    if(!res.ok) throw new Error("HTTP " + res.status);
    j = await res.json();
  }catch(e){
    busy(false);
    toast("检查失败：" + ((e && e.message) || e) + "（国内可能要梯子或换镜像）");
    return;
  }
  // 关键：拿到 json 就【立刻】解除遮罩。
  // 之前把 busy(false) 放在 finally 里，要等 changelog 那个 fetch 也结束 ——
  // 它一卡住，遮罩就永远卡在屏幕上。
  busy(false);

  const curVC = parseInt(mi.versionCode || "0", 10) || 0;
  const newVC = parseInt(j.versionCode || "0", 10) || 0;
  const newer = newVC > curVC;
  // 你装的是"比线上还新"的开发版（自己打过包的情况）—— 说清楚，别让人以为是没更新
  const ahead = !newer && curVC > newVC;
  openModal(newer ? "🎉 有新版本" : (ahead ? "当前是较新的开发版" : "已是最新"),
    "当前 " + (mi.version || "?") + " · versionCode " + curVC + (ahead ? "（比线上还新）" : ""),
    '<section class="card row-list">' +
      '<div class="row"><span>最新版本</span><strong class="' + (newer ? "ok" : "") + '">' + esc(j.version || "?") + '</strong></div>' +
      '<div class="row"><span>versionCode</span><strong>' + esc(String(newVC)) + '</strong></div>' +
      (j.date ? '<div class="row"><span>发布</span><strong>' + esc(j.date) + '</strong></div>' : "") +
      (ahead ? '<p class="field-hint">你这台装的 versionCode 比线上发布的还高 —— 一般是自己在本地打包装过的开发版。想回到发布版就装一次 Release 里的 zip。</p>' : "") +
    '</section>' +
    (j.changelog ? '<div class="section-head"><h2>更新内容</h2></div><div class="logbox" style="max-height:26vh" id="updLog">读取中…</div>' : "") +
    (newer ? banner("warn", "下载地址", esc(j.zipUrl || "（没配）") + "　→ 复制到浏览器/下载器打开") : ""),
    newer ? '<button data-act="dl">用浏览器打开下载</button><button data-act="ok">关闭</button>'
          : '<button data-act="ok">关闭</button>');
  const f = $("modalFooter");
  f.querySelector('[data-act="ok"]').onclick = closeModal;
  const dl = f.querySelector('[data-act="dl"]');
  if(dl) dl.onclick = async () => {
    if(j.zipUrl) await sh("am start -a android.intent.action.VIEW -d " + shq(j.zipUrl) + " 2>&1", 20000);
    toast("已交给浏览器");
  };
  // changelog 后台加载，不 await —— 拉不到也不影响主流程
  if(j.changelog) loadChangelog(j.changelog);
}
async function loadChangelog(url){
  const set = txt => { const el = $("updLog"); if(el) el.textContent = txt; };
  try{
    const cr = await fetchTO(url + "?t=" + Date.now(), 25000);
    const ct = await cr.text();
    set(ct.slice(0, 4000));
  }catch(e){
    set("(更新日志拉不到，不影响安装)");
  }
}

/* ---- 配置文件读写 ----
   monitor.conf 是明文 "key=value"，一行一条，App 每 2 秒读一次：
     bg=#070a0f      背景色
     fg=#e8ecf2      全局文字色（只有开了「固定色」才写；不写 = 按负载自动变色）
     size=1.0        字号倍率
     show=cpu,fps,pow,temp
     tf=hm           时间格式：hm=时:分，hms=时:分:秒
     cpu=#5be38a     单项颜色（不写 = 自动）                        */
function monCfgBody(){
  const c = monCfg();
  const bg = ($("monBg") || {}).value || "#070a0f";
  const sz = ($("monSize") || {}).value || "1";
  let b = "bg=" + bg + "\nsize=" + sz + "\ntf=" + c.tf + "\nshow=" + c.show.join(",") + "\n";
  if(c.fgOn) b += "fg=" + (($("monFg") || {}).value || c.fg) + "\n";
  MON_ITEMS.forEach(function(it){
    const v = c.colors[it[0]];
    if(v) b += it[0] + "=" + v + "\n";
  });
  return b;
}
function monPaint(){
  const c = monCfg();
  const sr = $("monShowRow");
  if(sr){
    sr.innerHTML = monShowHTML();
    sr.querySelectorAll("[data-show]").forEach(function(b){
      b.onclick = function(){
        const k = b.dataset.show, i = c.show.indexOf(k);
        if(i >= 0){
          if(c.show.length <= 1){ toast("至少留一项 —— 全关掉悬浮窗就成一条缝了"); return; }
          c.show.splice(i, 1);
        } else c.show.push(k);
        monPaint(); monDirty();
      };
    });
  }
  const cg = $("monColorGrid");
  if(cg){
    cg.innerHTML = monColorHTML();
    cg.querySelectorAll("[data-auto]").forEach(function(b){
      b.onclick = function(){
        const k = b.dataset.auto;
        if(c.colors[k]) delete c.colors[k];
        else c.colors[k] = (($("monC_" + k) || {}).value) || MON_DEF_COLOR;
        monPaint(); monDirty();
      };
    });
    cg.querySelectorAll("input[type=color]").forEach(function(inp){
      inp.oninput = function(){
        const k = inp.id.slice(5);
        if(!c.colors[k]){ c.colors[k] = inp.value; monPaint(); }
        else c.colors[k] = inp.value;
        monDirty();
      };
    });
  }
  [["hm","时:分"],["hms","时:分:秒"]].forEach(function(p){
    const b = $("monTf_" + p[0]);
    if(!b) return;
    const on = c.tf === p[0];
    b.style.background = on ? "var(--blue-soft)" : "";
    b.style.color = on ? "var(--blue)" : "";
    b.onclick = function(){ c.tf = p[0]; monPaint(); monDirty(); };
  });
  const fa = $("monFgAuto");
  if(fa){
    fa.style.background = c.fgOn ? "var(--blue-soft)" : "";
    fa.style.color = c.fgOn ? "var(--blue)" : "";
    fa.textContent = c.fgOn ? "固定色" : "自动";
    fa.onclick = function(){ c.fgOn = !c.fgOn; monPaint(); monDirty(); };
  }
  const fgi = $("monFg");
  if(fgi) fgi.style.opacity = c.fgOn ? "1" : ".35";
  const sbtn = $("monStepBtn");
  if(sbtn){
    sbtn.textContent = "步长 " + (c.step || 5);
    sbtn.onclick = function(){
      const seq = [1, 5, 10, 30];
      const i = seq.indexOf(c.step || 5);
      c.step = seq[(i + 1) % seq.length];
      monPaint();
    };
  }
  document.querySelectorAll(".monrow [data-mv]").forEach(function(b){
    b.onclick = function(){
      const p = b.dataset.mv.split(",");
      monMove(parseInt(p[0], 10), parseInt(p[1], 10));
    };
  });
  const cc = $("monCenter"); if(cc) cc.onclick = monCenter;
  const pb = $("monPosBtn"); if(pb) pb.onclick = monPos;
  const rp = $("monResetPos"); if(rp) rp.onclick = monResetPos;
  const sv = $("monSave"); if(sv) sv.onclick = monSaveCfg;
  const rc = $("monResetCfg"); if(rc) rc.onclick = monResetCfg;
  const sl = $("monSize");
  if(sl) sl.oninput = function(){
    const el = $("monSizeVal");
    const v = parseFloat(sl.value);
    if(el) el.textContent = (isFinite(v) ? v : 1).toFixed(1) + "×";
  };
}
function monDirty(){
  const h = $("monHint");
  if(h) h.textContent = "改好了 —— 点「保存」，2 秒内生效。";
}
async function monSaveCfg(){
  if(thermalState().demo){ toast("演示模式：未执行"); return; }
  const body = monCfgBody();
  busy(true, "保存中");
  try{
    const r = await sh(
      "mkdir -p /data/adb/ksu_toolbox; printf %s " + shq(body) + " > " + shq(MON_CONF) +
      "; chmod 644 " + shq(MON_CONF) + "; wc -c < " + shq(MON_CONF), 20000);
    const n = String(r.stdout || "").trim();
    toast(/^\d+$/.test(n) ? "已保存，2 秒内生效" : ("保存可能失败：" + n.slice(0,60)));
    const h = $("monHint");
    if(h && /^\d+$/.test(n)) h.textContent = "已保存（" + n + " 字节）：显示 " + monCfg().show.join("/") + "，时间 " + monCfg().tf;
  }finally{ busy(false); }
}
async function monResetCfg(){
  if(thermalState().demo){ toast("演示模式：未执行"); return; }
  try{
    await sh("rm -f " + shq(MON_CONF) + " 2>/dev/null; echo done", 15000);
    state.mon = null; monCfg();
    if($("monFg")) $("monFg").value = "#e8ecf2";
    if($("monBg")) $("monBg").value = "#070a0f";
    if($("monSize")) $("monSize").value = "1";
    if($("monSizeVal")) $("monSizeVal").textContent = "1.0×";
    monPaint();
    toast("已恢复默认：CPU / FPS / 功耗 / 温度，其余按负载自动配色");
  }catch(e){ toast("出错：" + ((e && e.message) || e)); }
}
/* ---- 位置控制：让桌面 App 自己挪悬浮窗 ----
   dx/dy = 相对移动（px）；ax/ay = 绝对定位；center = 左右居中
   实际在 MonitorActivity → MonitorService 里执行，这边只是发 Intent     */
async function monMove(dx, dy){
  if(thermalState().demo){ toast("演示模式：未执行"); return; }
  const step = monCfg().step || 5;
  const ax = dx * step, ay = dy * step;
  try{
    const r = await sh("am start -n " + MON_PKG + "/.MonitorActivity --ei dx " + ax + " --ei dy " + ay + " 2>&1", 20000);
    const out = String(r.stdout || "");
    if(/Error|Exception|does not exist/i.test(out)) toast("挪不动：" + out.trim().slice(0, 80));
    else toast("挪动 " + ax + " / " + ay + " px" + (step !== 5 ? "（步长 " + step + "）" : ""));
  }catch(e){ toast("出错：" + ((e && e.message) || e)); }
  setTimeout(monPos, 800);
}
async function monCenter(){
  if(thermalState().demo){ toast("演示模式：未执行"); return; }
  try{
    await sh("am start -n " + MON_PKG + "/.MonitorActivity --ez center true 2>&1", 20000);
    toast("已请求左右居中");
  }catch(e){ toast("出错：" + ((e && e.message) || e)); }
  setTimeout(monPos, 800);
}
async function monPos(){
  const el = $("monPosInfo");
  try{
    const r = await sh("cat /data/data/" + MON_PKG + "/shared_prefs/monitor.xml 2>/dev/null", 12000);
    const t = String(r.stdout || "");
    const g = k => { const m = new RegExp('name="' + k + '" value="(-?\\d+)"').exec(t); return m ? m[1] : null; };
    const x = g("mx"), y = g("my");
    if(el) el.textContent = (x === null && y === null)
      ? "还没记过位置 —— 先开一次悬浮窗，或者按一下方向键。"
      : ("当前位置：x=" + x + "  y=" + y + " px（用拖动改的位置也会显示在这）");
  }catch(e){ if(el) el.textContent = "读位置失败：" + ((e && e.message) || e); }
}
async function monResetPos(){
  if(thermalState().demo){ toast("演示模式：未执行"); return; }
  try{
    await sh("am start -n " + MON_PKG + "/.MonitorActivity --ez reset true 2>&1", 25000);
    toast("已重置悬浮窗位置（回到状态栏下面）");
    setTimeout(monPos, 900);
  }catch(e){ toast("出错：" + ((e && e.message) || e)); }
}
async function monLoadCfg(){
  try{
    const r = await sh("cat " + shq(MON_CONF) + " 2>/dev/null", 15000);
    const txt = String(r.stdout || "");
    const g = k => { const m = new RegExp("^" + k + "=(.*)$", "m").exec(txt); return m ? m[1].trim() : null; };
    const c = monCfg();
    const fg = g("fg"), bg = g("bg"), sz = g("size"), tf = g("tf"), shw = g("show");
    if(shw){
      const arr = shw.split(",").map(s => s.trim().toLowerCase()).filter(k => MON_ITEMS.some(it => it[0] === k));
      c.show = arr.length ? arr : MON_DEF_SHOW.slice();
    }
    c.colors = {};
    MON_ITEMS.forEach(function(it){
      const v = g(it[0]);
      if(v && v.toLowerCase() !== "auto") c.colors[it[0]] = v;
    });
    if(tf === "hm" || tf === "hms") c.tf = tf;
    c.fgOn = !!fg;
    if(fg){ c.fg = fg; }
    if(bg && $("monBg")) $("monBg").value = bg;
    if(fg && $("monFg")) $("monFg").value = fg;
    if(sz && $("monSize")) $("monSize").value = sz;
    if($("monSizeVal")) $("monSizeVal").textContent = (sz || "1") + "×";
    monPaint();
  }catch(e){}
}

/* ============================================================
 *  12. 模态框 / Toast / 调度
 * ============================================================ */
function openModal(title, sub, bodyHTML, footerHTML){
  $("modalTitle").textContent = title;
  $("modalSub").textContent = sub || "";
  $("modalBody").innerHTML = bodyHTML || "";
  $("modalFooter").innerHTML = footerHTML || "";
  $("modalBody").scrollTop = 0;
  $("modalMask").classList.add("show");
}
function closeModal(){ $("modalMask").classList.remove("show"); }
let toastTimer = 0;
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}
function busy(on, text){
  $("busyText").textContent = text || "正在处理";
  $("busyMask").classList.toggle("show", !!on);
}
async function showAllProps(){
  busy(true, "读取全部属性");
  try{
    let rows = [];
    if(!HAS_BRIDGE){
      const demo = DEMO.ov();
      rows = Object.keys(demo).map(k => [k, demo[k]]);
      rows.push(["ro.demo.mode", "true"]);
    }else{
      const r = await sh("getprop", 20000);
      rows = String(r.stdout).split("\n").map(line => {
        const m = line.match(/^\[(.+?)\]:\s*\[(.*)\]$/);
        return m ? [m[1], m[2]] : null;
      }).filter(Boolean);
    }
    if(!rows.length){ toast("没有读到属性"); return; }
    const html = `<div class="modal-search"><input class="modern-input" id="propSearch" placeholder="搜索属性名或值…" autocomplete="off" spellcheck="false"></div>
      <div class="row-list" id="propRows">${rows.map(([k, v]) => `<div class="row" data-k="${esc((k + " " + v).toLowerCase())}"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join("")}</div>`;
    openModal("全部系统属性", rows.length + " 条 getprop", html);
    const search = $("propSearch");
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll("#propRows .row").forEach(el => {
        el.style.display = !q || el.getAttribute("data-k").indexOf(q) >= 0 ? "" : "none";
      });
    });
  }catch(e){
    toast("读取失败：" + (e && e.message || e));
  }finally{
    busy(false);
  }
}

const TABS = {home:homeHTML, perf:perfHTML, app:appHTML, thermal:thermalHTML, power:powerHTML, device:deviceHTML,
              term:termHTML, settings:settingsHTML, diag:diagHTML, about:aboutHTML};
let timer = 0;

function switchTab(tab){
  if(!TABS[tab]) return;
  if(["home","perf","thermal","power","device","term"].indexOf(tab) >= 0) state.lastTab = tab;
  state.tab = tab;
  const dockTab = (tab === "diag" || tab === "about") ? "settings" : tab;
  document.querySelectorAll(".dock-item").forEach(b => b.classList.toggle("active", b.dataset.tab === dockTab));
  $("content").innerHTML = TABS[tab]();
  if(tab === "perf"){ monInitPerf(); rrInit(); gaInit(); }
  if(tab === "power" || tab === "term"){ setTimeout(() => { if($("chgStatus")) chgStatus(); }, 400); }
  if(tab === "term"){ initTerm(); guardInit(); stopClock(); clearInterval(timer); return; }
  if(tab === "settings" || tab === "about"){
    stopClock(); clearInterval(timer);
    // 这两个页面要读 thermalState()，先确保数据在
    loadThermal().then(() => { if(state.tab === tab) $("content").innerHTML = TABS[tab](); });
    if(tab === "settings") checkApp();
    return;
  }
  if(tab === "diag"){
    stopClock(); clearInterval(timer);
    loadThermal().then(() => { if(state.tab === "diag") runDiag(); });
    return;
  }
  if(tab === "home") startClock(); else stopClock();
  if(tab === "device"){ clearInterval(timer); loadDF(); return; }
  if(tab === "app"){ clearInterval(timer); initApp(); startLoop(); return; }
  if(tab === "thermal"){ clearInterval(timer); thermalWarnOnce(); thermalBoot(); return; }
  if(tab === "perf") state.perfCache = null;
  refresh();
  startLoop();
}
function startLoop(){
  clearInterval(timer);
  const iv = state.tab === "perf" ? 2000 : state.tab === "thermal" ? 2000
           : state.tab === "app" ? 3000 : state.tab === "power" ? 2500 : 5000;
  timer = setInterval(() => { if(!document.hidden) refresh(); }, iv);
}
async function refresh(){
  if(state.busy) return;
  state.busy = true;
  const btn = $("refreshBtn");
  if(btn) btn.classList.add("spin");
  try{
    if(state.tab === "home"){
      const m = await fetchMap(OV_LINES, "ov", 20000);
      state.map.home = m; updateHome(m);
    }else if(state.tab === "perf"){
      const m = await fetchPerf();
      state.map.perf = m; updatePerf(m);
    }else if(state.tab === "app"){
      if(appState().mode === "procs") await loadProcs();
    }else if(state.tab === "thermal"){
      await loadThermalDyn();
    }else if(state.tab === "power"){
      const m = await fetchMap(PW_LINES, "pw", 15000);
      state.map.power = m; updatePower(m);
    }
  }catch(e){
    toast("读取失败：" + (e && e.message || e));
  }finally{
    state.busy = false;
    if(btn) btn.classList.remove("spin");
  }
}

/* ============================================================
 * 13. 启动
 * ============================================================ */
function appInstalled(){ return state.appInstalled === true; }
async function checkApp(){
  const r = await sh("pm list packages com.jeteezntmax.toolbox 2>/dev/null; echo P=$?", 15000);
  state.appInstalled = /package:com\.jeteezntmax\.toolbox/.test(r.stdout);
  if(state.tab === "settings") $("content").innerHTML = TABS.settings();
}
async function installApp(){
  const dir = (thermalState().egDir || "/data/adb/modules/ksu_toolbox") + "/app/JeTeeZnTmax.apk";
  if(thermalState().demo){ toast("演示模式：未执行"); return; }
  busy(true, "正在安装");
  try{
    const r = await sh("pm install -r " + shq(dir) + " 2>&1", 90000);
    const out = (r.stdout || "").trim();
    if(/Success/i.test(out)){ state.appInstalled = true; toast("装好了，去桌面看看"); }
    else toast("安装失败：" + out.slice(0, 90));
    logOp("安装桌面 App → " + out.slice(0, 60));
  }finally{ busy(false); }
  if(state.tab === "settings") $("content").innerHTML = TABS.settings();
}
async function initApp(){
  const A = appState();
  renderAppTab();
  if(A.mode === "apps"){ if(!A.loadedApps) await loadApps(); }
  else await loadProcs();
}
/* 温控相关实测有 bug（触控），默认全关 + 只弹一次提醒 */
function thermalWarnOnce(){
  const p = prefs();
  if(p.thermWarn === "1") return;
  p.thermWarn = "1";
  try{ localStorage.setItem(PREF_KEY, JSON.stringify(p)); }catch(e){}
  openModal("⚠️ 温控这些开关，实测有 bug", "只提示这一次",
    banner("warn", "不推荐开启",
      "实测下来温控相关的选项会导致：**黑屏 / 死机 / 系统不稳定**。" +
      "其中**触控已经有实测 bug**（这个还没修）。") +
    '<section class="card row-list">' +
      '<div class="row"><span>默认状态</span><strong class="ok">全部关闭</strong></div>' +
      '<div class="row"><span>开机是否自动应用</span><strong>否（enabled=0 时直接 return）</strong></div>' +
      '<div class="row"><span>风险</span><strong class="warn">黑屏 / 死机 / 触控失效</strong></div>' +
    '</section>' +
    '<p class="field-hint">这个提示只弹一次。除非你清楚代价，否则别开。</p>',
    '<button data-act="ok">我知道了</button>');
  $("modalFooter").querySelector('[data-act="ok"]').onclick = closeModal;
}

function withTokenAddr(){
  const egT = thermalState();
  const p = prefs();
  const a = "http://127.0.0.1:" + (egT.webPort || p.port) + "/";
  return egT.webToken ? a + "?token=" + egT.webToken : a;
}
function init(){
  applyPrefs();
  initHttp();
  state.demoMode = !HAS_BRIDGE;
  // 模块信息
  try{
    const b = bridge();
    if(b && typeof b.moduleInfo === "function"){
      const mi = JSON.parse(b.moduleInfo());
      state.mi = mi;
      if(mi && mi.name) $("modName").textContent = mi.name;
      // module.prop 里的 version 常常自带 v（v2.0.0），别再补一个变成 vv2.0.0
      const _ver = mi && mi.version ? String(mi.version) : "";
      const _verTxt = _ver ? (/^v/i.test(_ver) ? _ver : "v" + _ver) : "";
      $("modVer").textContent = [_verTxt, mi && mi.author ? "by " + mi.author : "SYSTEM TOOLBOX"].filter(Boolean).join(" · ");
      if(mi && mi.description) $("modalIcon").textContent = (mi.id || "JZ").slice(0, 3).toUpperCase();
    }
  }catch(e){}
  if(state.demoMode) $("modVer").textContent = "演示模式 · 未检测到 KernelSU";

  $("dock").addEventListener("click", e => {
    const b = e.target.closest(".dock-item");
    if(b && b.dataset.tab !== state.tab) switchTab(b.dataset.tab);
  });
  $("menuBtn").addEventListener("click", openMenu);
  $("content").addEventListener("click", e => {
    const id = e.target && e.target.id;
    if(id === "monOpen") monOpen();
    else if(id === "monClose") monClose();
    else if(id === "monCheck") monCheck();
    else if(id === "monSave") monSaveCfg();
    else if(id === "monResetCfg") monResetCfg();
    else if(id === "updCheck") checkUpdate();
    else if(id === "chgLimitSet"){
      const v = (($("chgLimit")||{}).value || 90);
      const r = (($("chgRecover")||{}).value || "").trim();
      chgAct("开启充电保护", "protect " + v + (r ? " " + r : ""), "保护已开：" + v + "% 停" + (r ? "、" + r + "% 恢复" : ""));
    }
    else if(id === "chgLimitOff") chgAct("关闭充电保护", "protect off", "保护已关");
    else if(id === "chgSuspend") chgAct("停充", "suspend 1", "已发送停充");
    else if(id === "chgResume") chgAct("恢复充电", "suspend 0", "已恢复充电");
    else if(id === "chgSlowToggle"){
      const s = ($("chgStatus") || {}).dataset || {};
      chgAct("切换慢充", "slow " + (s.slow === "1" ? "0" : "1"), "慢充已切换");
    }

    else if(id === "monResetPos") monResetPos();
  });
  $("content").addEventListener("click", e => {
    const seg = e.target.closest("#amSeg button");
    if(seg){
      const A = appState();
      A.mode = seg.getAttribute("data-v");
      renderAppTab();
      if(A.mode === "procs") loadProcs(); else if(!A.loadedApps) loadApps();
      return;
    }
    const a = e.target.closest("[data-appact]");
    if(a){ handleAppAct(a.getAttribute("data-appact"), a.getAttribute("data-k1")); }
  });
  $("content").addEventListener("input", e => {
    if(e.target.id === "chgLimit"){
      const v = $("chgLimitVal"); if(v) v.textContent = e.target.value + "%";
      return;
    }
    if(e.target.id === "monSize"){
      const v = $("monSizeVal"); if(v) v.textContent = e.target.value + "×";
      return;
    }
    if(e.target.id !== "amSearch") return;
    const A = appState();
    if(A.mode === "apps"){ A.appQ = e.target.value; const b = $("amBody"); if(b) b.innerHTML = appRowsHTML(); }
    else { A.procQ = e.target.value; const b = $("amBody"); if(b) b.innerHTML = procRowsHTML(); }
  });
  $("content").addEventListener("click", e => {
    if(e.target.id !== "amReload") return;
    const A = appState();
    if(A.mode === "apps") loadApps(); else loadProcs();
  });
  // 弹窗里的导航按钮走文档级委托（content 的委托覆盖不到 modal）
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-act]");
    if(!g) return;
    const a = g.getAttribute("data-act");
    if(a === "go-settings"){ closeModal(); switchTab("settings"); }
    else if(a === "go-diag"){ closeModal(); switchTab("diag"); }
    else if(a === "go-about"){ closeModal(); switchTab("about"); }
  });
  document.addEventListener("click", e => {
    const d = e.target.closest("[data-dfact]");
    if(d && d.getAttribute("data-dfact") === "df-native"){ closeModal(); location.href = "./df.html"; }
  }, true);
  $("powerBtn").addEventListener("click", openPowerMenu);
  $("refreshBtn").addEventListener("click", () => {
    toast("已刷新");
    if(state.tab === "device") loadDF();
    else if(state.tab === "thermal"){ loadThermal(); loadThermalDyn(); }
    else if(state.tab !== "term") refresh();
  });
  $("modalClose").addEventListener("click", closeModal);
  $("modalMask").addEventListener("click", e => { if(e.target === $("modalMask")) closeModal(); });
  $("content").addEventListener("click", async e => {
    const seg = e.target.closest(".seg-mini button");
    if(seg){
      const box = seg.closest(".seg-mini");
      const key = box.getAttribute("data-pref");
      box.querySelectorAll("button").forEach(b => b.classList.remove("on"));
      seg.classList.add("on");
      const pp = prefs();
      pp[key] = seg.getAttribute("data-v");
      savePrefs();
      if(key === "unit"){ renderThermal(); }
      if(key === "speed" && ["perf","power"].indexOf(state.tab) >= 0) startLoop();
      return;
    }
    const gb = e.target.closest('[data-act="go-back"]');
    if(gb){ switchTab(gb.getAttribute("data-k1") || "home"); return; }
    const ga = e.target.closest("[data-act]");
    if(ga){
      const a = ga.getAttribute("data-act");
      if(a === "diag-again"){ runDiag(); return; }
      if(a === "diag-copy"){ const b = $("logBox"); copyText(b ? b.textContent : ""); return; }
      if(a === "diag-export"){
        busy(true, "导出");
        try{
          const b = $("logBox");
          const l = thermalState();
          const ok = await dfWriteFile("/sdcard/Download/ksu_toolbox_diag.txt", (b ? b.textContent : "") + "\n");
          toast(ok ? "已导出到 /sdcard/Download/ksu_toolbox_diag.txt" : "导出失败（演示模式？）");
        }finally{ busy(false); }
        return;
      }
      if(a === "wipe-oplog"){ clearOpLog(); toast("操作日志已清空"); if(state.tab === "diag") runDiag(); return; }
      if(a === "wipe-prefs"){ try{ localStorage.removeItem(PREF_KEY); }catch(e){} state.prefs = null; applyPrefs(); toast("已恢复默认设置"); switchTab("settings", true); return; }
      if(a === "republish"){ publishTasks().then(() => toast("已重新发布")); return; }
      if(a === "http-save" || a === "http-stop"){ await httpAction(a); return; }
      if(a === "http-copy"){ copyText(withTokenAddr()); return; }
      if(a === "app-install"){ await installApp(); return; }
      if(a === "app-check"){ await checkApp(); return; }
    }
    const th = e.target.closest("[data-thact]");
    if(th){
      thAct(th.getAttribute("data-thact"), th.getAttribute("data-k1"), th)
        .catch(err => toast("执行失败：" + ((err && err.message) || err)));
      return;
    }
    const d = e.target.closest("[data-dfact]");
    if(d && d.getAttribute("data-dfact") === "df-native"){ location.href = "./df.html"; return; }
    if(d){
      handleDFAction(d.getAttribute("data-dfact"), d).catch(err => toast("操作失败：" + ((err && err.message) || err)));
      return;
    }
    const b = e.target.closest("[data-act]");
    if(b && b.dataset.act === "allprops") showAllProps();
  });
  document.addEventListener("visibilitychange", () => {
    if(document.hidden) return;
    if(state.tab === "device") loadDF();
    else if(state.tab !== "term") refresh();
  });

  try{ window.__ksuTasks = buildTasks; }catch(e){}
  if(bridge() && typeof bridge().exec === "function"){
    setTimeout(() => { publishTasks(); }, 1500);
  }
  const first = prefs().tab;
  switchTab(TABS[first] ? first : "home");
}
window.addEventListener("error", e => {
  try{ toast("脚本异常：" + (e && e.message ? e.message : e)); }catch(_){}
});
window.addEventListener("unhandledrejection", e => {
  try{
    const r = e && e.reason;
    toast("操作异常：" + ((r && r.message) || r || ""));
  }catch(_){}
});

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
})();
</script>
