<style>
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#07070a;--bg-soft:#101116;
  --glass:rgba(31,32,38,.58);--glass-strong:rgba(43,44,52,.72);--glass-solid:#22232a;
  --border:rgba(255,255,255,.11);--border-hi:rgba(255,255,255,.19);
  --text:#f7f7fa;--text-2:rgba(235,235,245,.64);--text-3:rgba(235,235,245,.36);
  --blue:#0a84ff;--blue-soft:rgba(10,132,255,.16);
  --green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;
  --track:rgba(120,120,128,.34);--track-soft:rgba(120,120,128,.16);
  --shadow:0 18px 60px rgba(0,0,0,.34);--shadow-soft:0 8px 28px rgba(0,0,0,.2);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{color-scheme:light;
    --bg:#f2f2f7;--bg-soft:#e9e9ef;
    --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.76);--glass-solid:#fff;
    --border:rgba(0,0,0,.07);--border-hi:rgba(255,255,255,.88);
    --text:#111114;--text-2:rgba(60,60,67,.68);--text-3:rgba(60,60,67,.38);
    --blue:#007aff;--blue-soft:rgba(0,122,255,.11);
    --green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;
    --track:rgba(120,120,128,.22);--track-soft:rgba(120,120,128,.1);
    --shadow:0 20px 55px rgba(46,48,58,.14);--shadow-soft:0 8px 24px rgba(46,48,58,.09);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 calc(112px + env(safe-area-inset-bottom,0));background:var(--bg);color:var(--text);font:14px/1.5 var(--font)}
button,input,textarea{color:inherit;font:inherit}
button{border:0;cursor:pointer;background:0 0}
button:disabled{opacity:.45;pointer-events:none}
::-webkit-scrollbar{width:0;height:0}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 70%,transparent))}
.ambient i{position:absolute;border-radius:50%}
.ambient i:first-child{width:300px;height:300px;top:-120px;right:-80px;background:radial-gradient(circle,rgba(10,132,255,.24),transparent 70%)}
.ambient i:nth-child(2){width:280px;height:280px;top:42%;left:-180px;background:radial-gradient(circle,rgba(191,90,242,.14),transparent 70%)}
.ambient i:nth-child(3){width:240px;height:240px;right:-150px;bottom:-50px;background:radial-gradient(circle,rgba(48,209,88,.11),transparent 70%)}
.app-shell{width:min(100%,430px);margin:0 auto;padding:20px 15px 26px;container-type:inline-size}
.masthead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand-mark{width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px solid var(--border-hi);border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.16),transparent 46%),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),var(--shadow-soft)}
.brand-mark{overflow:hidden;padding:0}
.brand-mark img{width:100%;height:100%;display:block;object-fit:cover}
.brand-mark span{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:-.4px}
.brand-copy{min-width:0}
.brand-copy strong{display:block;overflow:hidden;font-size:15px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.brand-copy small{display:block;margin-top:1px;overflow:hidden;color:var(--text-3);font:9px/1.2 var(--mono);text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--border-hi);border-radius:13px;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);color:var(--text-2)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.9}
.icon-btn.spin svg{animation:.7s linear infinite spin}
.icon-btn + .icon-btn{margin-left:8px}
.icon-btn.wide{width:auto;height:38px;padding:0 12px;display:flex;align-items:center;gap:6px;border-radius:14px;background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 34%,transparent);color:var(--blue);font-size:11.5px;font-weight:680;box-shadow:0 4px 14px rgba(10,132,255,.16)}
.icon-btn.wide span{white-space:nowrap}
.metric-card>strong.xs{font-size:13px;font-variant-numeric:tabular-nums}
#mUptime,#mUptimeSub,#mBootSub,.mc-row>strong{font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}
.content{display:flex;flex-direction:column;min-height:240px}
.view{display:flex;flex-direction:column;gap:12px;animation:.28s both reveal}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.08),transparent 45%),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hero{display:flex;align-items:center;gap:14px;padding:18px;border-color:var(--border-hi);box-shadow:var(--shadow-soft),inset 0 1px 0 rgba(255,255,255,.1)}
.hero::before{content:"";position:absolute;width:190px;height:190px;top:-110px;right:-70px;border-radius:50%;background:var(--blue-soft)}
.hero-mark{position:relative;width:54px;height:54px;flex:none;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,var(--blue),var(--purple));color:#fff;font-size:16px;font-weight:780;box-shadow:0 8px 22px rgba(10,132,255,.3)}
.hero-body{position:relative;min-width:0;flex:1}
.hero-body strong{display:block;overflow:hidden;font-size:17px;font-weight:700;letter-spacing:-.02em;text-overflow:ellipsis;white-space:nowrap}
.hero-body>span{display:block;margin-top:4px;overflow:hidden;color:var(--text-2);font:10px/1.5 var(--mono);text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;padding:4px 9px;border-radius:9px;background:var(--track-soft);color:var(--text-2);font-size:9px;font-weight:650;white-space:nowrap}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.green{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.chip.orange{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.chip.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric-card{position:relative;min-width:0;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:9px;padding:15px;border:1px solid var(--border);border-radius:23px;background:linear-gradient(145deg,rgba(255,255,255,.08),transparent 45%),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.metric-card>span,.mc-row>span{color:var(--text-2);font-size:11px;white-space:nowrap}
.metric-card>strong{overflow:hidden;font-size:17px;font-weight:650;letter-spacing:-.02em;text-overflow:ellipsis;white-space:nowrap}
.metric-card>strong.sm{font-size:14px}
.metric-card>strong.ok{color:var(--green)}
.metric-card>strong.hi{color:var(--blue)}
.metric-card>strong.danger{color:var(--red)}
.mc-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mc-row>strong{font-size:17px;font-weight:650;letter-spacing:-.02em}
.mc-sub{overflow:hidden;color:var(--text-3);font:9px/1.45 var(--mono);text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .45s cubic-bezier(.2,.8,.2,1),background .3s}
.bar.warn i{background:var(--orange)}
.bar.danger i{background:var(--red)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 3px 0}
.section-head h2{font-size:15px;font-weight:700;letter-spacing:-.02em}
.section-head .hint{color:var(--text-3);font:9px/1 var(--mono)}
.add-inline{min-height:32px;display:inline-flex;align-items:center;gap:5px;padding:0 12px;border:1px solid var(--border-hi);border-radius:16px;background:var(--glass-strong);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.08);color:var(--blue);font-size:11px;font-weight:650}
.add-inline span{font-size:16px;font-weight:300;line-height:1}
.add-inline:active{transform:scale(.96)}
.row-list{display:flex;flex-direction:column;padding:4px 0}
.row{display:flex;align-items:center;gap:12px;min-height:42px;padding:8px 15px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row>span{flex:none;color:var(--text-2);font-size:11px}
.row>strong{margin-left:auto;max-width:64%;overflow:hidden;color:var(--text);font:600 11px/1.5 var(--mono);text-align:right;text-overflow:ellipsis}
.row>strong.ok{color:var(--green)}
.row>strong.hi{color:var(--blue)}
.row>strong.warn{color:var(--orange)}
.gauge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:15px 8px 13px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.08),transparent 45%),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.gauge{width:76px;height:76px;display:block}
.gauge circle{fill:none;stroke-width:9;stroke-linecap:round}
.gauge .g-bg{stroke:var(--track)}
.gauge .g-fg{stroke:var(--blue);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1),stroke .3s}
.gauge-card .gv{font-size:14px;font-weight:680;letter-spacing:-.02em}
.gauge-card .gl{color:var(--text-2);font-size:10px}
.gauge-card .gs{color:var(--text-3);font:9px/1.3 var(--mono)}
.spark-card{padding:15px}
.spark-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.spark-head strong{font-size:12px;font-weight:680}
.spark-head span{color:var(--text-3);font:9px/1 var(--mono)}
.spark{width:100%;height:78px;display:block;overflow:visible}
.spark .line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:d .3s}
.spark .fill{fill:var(--blue);fill-opacity:.13;stroke:none}
.spark .grid{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}
.core-list{display:flex;flex-direction:column}
.core.w4{grid-template-columns:minmax(0,90px) minmax(0,1fr) 60px 32px}
.core .zflag{color:var(--orange);font:500 8px/1 var(--font);font-style:normal;text-align:right}
.th-input{width:112px;height:30px;flex:none;padding:0 8px;border:1px solid var(--border);border-radius:9px;outline:0;background:var(--track-soft);color:var(--text);font:10px var(--mono);text-align:right}
.th-input:focus{border-color:color-mix(in srgb,var(--blue) 60%,transparent);box-shadow:0 0 0 3px var(--blue-soft)}
.core{display:grid;grid-template-columns:44px minmax(0,1fr) 62px;align-items:center;gap:10px;min-height:38px;padding:5px 15px;border-bottom:1px solid var(--border)}
.core:last-child{border-bottom:0}
.core b{color:var(--text-2);font:600 10px/1 var(--mono)}
.core em{overflow:hidden;color:var(--text-3);font:400 9px/1 var(--mono);font-style:normal;text-align:right}
.term-bar{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;border:1px solid var(--border-hi);border-radius:19px;background:linear-gradient(145deg,rgba(255,255,255,.09),transparent 45%),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}
.term-bar b{flex:none;color:var(--green);font:700 13px/1 var(--mono)}
.term-input{flex:1;min-width:0;height:34px;border:0;outline:0;background:0 0;font:12px/1 var(--mono)}
.term-input::placeholder{color:var(--text-3)}
.term-run{flex:none;height:34px;padding:0 15px;border-radius:12px;background:var(--blue);color:#fff;font-size:12px;font-weight:680}
.term-run:active{transform:scale(.96)}
.chip-row{display:flex;gap:7px;overflow-x:auto;padding:2px 3px}
.chip-btn{flex:none;min-height:30px;padding:0 12px;border-radius:12px;background:var(--track-soft);color:var(--text-2);font:11px/1 var(--mono);white-space:nowrap}
.chip-btn:active{transform:scale(.96);color:var(--blue)}
.log-frame{overflow:hidden;border:1px solid var(--border-hi);border-radius:24px;background:rgba(11,12,16,.86);box-shadow:var(--shadow-soft),inset 0 1px 0 rgba(255,255,255,.1)}
.log-head{display:flex;align-items:center;min-height:44px;gap:10px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.log-signal{display:flex;align-items:flex-end;gap:3px}
.log-signal i{width:3px;border-radius:3px;background:#30d158}
.log-signal i:first-child{height:6px;opacity:.45}
.log-signal i:nth-child(2){height:10px;opacity:.7}
.log-signal i:nth-child(3){height:14px}
.log-title{color:#d8d8df;font-size:10px}
.log-clear{margin-left:auto;padding:6px 9px;border-radius:9px;background:rgba(255,69,58,.1);color:#ff6961;font-size:9px;font-weight:680}
.log-clear:active{transform:scale(.95)}
.log-body{min-height:230px;max-height:48vh;overflow:auto;padding:15px;color:#afb1bc;font:10px/1.75 var(--mono);white-space:pre-wrap;word-break:break-all}
.log-body .cmd{color:#8fd6ff}
.log-body .ok{color:#7ee08a}
.log-body .err{color:#ff7c72}
.log-body .sys{color:#8b8d98}
.file-card{display:flex;flex-direction:column;gap:9px;padding:15px}
.file-card label{color:var(--text-2);font-size:10px}
.file-row{display:flex;gap:8px}
.modern-input{flex:1;min-width:0;height:44px;padding:0 13px;border:1px solid var(--border);border-radius:14px;outline:0;background:var(--track-soft);font:11px var(--mono)}
.modern-input:focus{border-color:color-mix(in srgb,var(--blue) 60%,transparent);box-shadow:0 0 0 3px var(--blue-soft)}
.modern-input::placeholder{color:var(--text-3)}
.action-btn{min-height:44px;padding:0 16px;border-radius:14px;background:var(--track-soft);color:var(--text);font-size:12px;font-weight:650;white-space:nowrap}
.action-btn.primary{background:var(--blue);color:#fff}
.action-btn.ghost{background:var(--blue-soft);color:var(--blue)}
.action-btn:active{transform:scale(.97);opacity:.88}
.dock{position:fixed;z-index:500;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0));left:16px;display:grid;grid-template-columns:repeat(8,1fr);gap:1px;width:min(calc(100% - 32px),430px);margin:auto;padding:6px;border:1px solid var(--border-hi);border-radius:27px;background:linear-gradient(145deg,rgba(255,255,255,.1),transparent 42%),var(--glass);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.13);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
.dock-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:53px;border-radius:16px;color:var(--text-2);font-size:7.5px;font-weight:600;letter-spacing:-.01em;transition:transform .18s,color .18s,background .18s}
.dock-item svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}
.dock-item.active{background:var(--glass-strong);box-shadow:0 3px 14px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.12);color:var(--blue)}
.dock-item:active{transform:scale(.95)}
.modal-mask{position:fixed;inset:0;z-index:9000;display:none;align-items:flex-end;justify-content:center;padding:18px;background:rgba(0,0,0,.48)}
.modal-mask.show{display:flex;animation:.2s maskIn}
@keyframes maskIn{from{opacity:0}}
.modal{width:min(100%,600px);max-height:min(86vh,760px);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border-hi);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.1),transparent 38%),var(--glass-strong);box-shadow:0 28px 85px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.13);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);animation:.27s cubic-bezier(.2,.76,.25,1) both sheetIn}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.98)}}
.modal-header{display:flex;align-items:center;gap:12px;padding:17px 19px;border-bottom:1px solid var(--border)}
.modal-icon{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:13px;background:var(--blue-soft);color:var(--blue);font-size:10px;font-weight:750}
.modal-heading{min-width:0}
.modal-heading h2{font-size:15px;font-weight:700}
.modal-heading p{margin-top:2px;color:var(--text-2);font:9px/1.3 var(--mono)}
.modal-close{width:32px;height:32px;margin-left:auto;display:grid;place-items:center;border-radius:50%;background:var(--track-soft);color:var(--text-2);font-size:17px;line-height:1}
.modal-body{flex:1;overflow:auto;padding:14px 0 8px}
.modal-search{padding:0 17px 12px}
.modal-body .row{padding-left:17px;padding-right:17px}
.busy-mask{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.28);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
.busy-mask.show{opacity:1;visibility:visible;pointer-events:auto}
.busy-card{min-width:150px;display:flex;flex-direction:column;align-items:center;gap:13px;padding:22px 24px;border:1px solid var(--border-hi);border-radius:25px;background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 44%),var(--glass-strong);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.14);font-size:12px;font-weight:600}
.busy-spinner{position:relative;width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:.72s linear infinite spin}
/* ---------- 机型伪装（device_faker 配置前端） ---------- */
.banner{display:flex;gap:11px;padding:14px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.07),transparent 48%),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.banner.warn{border-color:color-mix(in srgb,var(--orange) 34%,transparent);background:color-mix(in srgb,var(--orange) 10%,transparent)}
.banner.danger{border-color:color-mix(in srgb,var(--red) 34%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent)}
.banner.ok{border-color:color-mix(in srgb,var(--green) 30%,transparent);background:color-mix(in srgb,var(--green) 9%,transparent)}
.banner i{flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:8px;background:var(--blue-soft);color:var(--blue);font:700 12px/1 var(--font);font-style:normal}
.banner.warn i{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.banner.danger i{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.banner.ok i{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.banner div{min-width:0;flex:1}
.banner strong{display:block;font-size:12px;font-weight:680}
.banner p{margin-top:3px;color:var(--text-2);font-size:10px;line-height:1.6;word-break:break-all}
.banner code{font-family:var(--mono);font-size:9px;color:var(--text-3)}
.savebar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--blue) 32%,transparent);border-radius:18px;background:linear-gradient(145deg,var(--blue-soft),transparent),var(--glass-strong);box-shadow:var(--shadow-soft);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.savebar span{flex:1;color:var(--blue);font-size:11px;font-weight:650}
.savebar button{min-height:34px;padding:0 14px;border-radius:12px;font-size:11px;font-weight:650}
.savebar .s{background:var(--blue);color:#fff}
.savebar .d{background:var(--track-soft);color:var(--text-2)}
.df-item{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text);text-align:left}
.df-item:last-child{border-bottom:0}
.df-item:active{background:var(--track-soft)}
.df-item .mark{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:var(--blue-soft);color:var(--blue);font-size:9px;font-weight:760;letter-spacing:-.03em}
.df-item .body{min-width:0;flex:1}
.df-item .body strong{display:block;overflow:hidden;font-size:13px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}
.df-item .body em{display:block;margin-top:3px;overflow:hidden;color:var(--text-2);font:9px/1.5 var(--mono);font-style:normal;text-overflow:ellipsis;white-space:nowrap}
.df-item .body b{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:6px;background:var(--track-soft);color:var(--text-3);font:9px/1.4 var(--mono);font-weight:500}
.df-item .go{flex:none;color:var(--text-3);font-size:16px;line-height:1}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-grid .wide{grid-column:1/-1}
.fld{min-width:0}
.fld label{display:block;margin-bottom:6px;color:var(--text-2);font-size:9px}
.fld label b{color:var(--text-3);font:400 8px/1 var(--mono)}
.fld input,.fld textarea{width:100%;border:1px solid var(--border);border-radius:13px;outline:0;background:var(--track-soft);color:var(--text);font:11px/1.5 var(--mono)}
.fld input{height:42px;padding:0 12px}
.fld textarea{min-height:76px;padding:11px 12px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:color-mix(in srgb,var(--blue) 60%,transparent);box-shadow:0 0 0 3px var(--blue-soft)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--text-3)}
.switchrow{display:flex;align-items:center;gap:14px;min-height:56px;padding:11px 15px;border-bottom:1px solid var(--border);text-align:left;width:100%}
.switchrow:last-child{border-bottom:0}
.switchrow .t{min-width:0;flex:1}
.switchrow .t strong{display:block;font-size:12px;font-weight:660}
.switchrow .t span{display:block;margin-top:2px;color:var(--text-2);font-size:9px;line-height:1.5}
.swt{position:relative;width:45px;height:26px;flex:none;border-radius:999px;background:var(--track);transition:background .18s}
.swt::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.swt.on{background:var(--green)}
.swt.on::after{transform:translateX(19px)}
.seg{display:flex;gap:2px;padding:2px;border-radius:12px;background:var(--track-soft);flex:none}
.seg button{padding:6px 10px;border-radius:10px;color:var(--text-2);font-size:10px;font-weight:650;transition:background .16s,color .16s}
.seg button.on{background:var(--glass-strong);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.field-hint{margin:2px 2px 10px;color:var(--text-3);font:9px/1.6 var(--mono)}
.modal-section{margin:16px 0 10px;color:var(--text-2);font-size:10px;font-weight:650}
.modal-section:first-child{margin-top:0}
.modal-footer{display:flex;gap:8px;padding:13px 19px 18px;border-top:1px solid var(--border)}
.modal-footer:empty{display:none}
.modal-footer button{flex:1;min-height:44px;border-radius:14px;background:var(--track-soft);font-size:12px;font-weight:650}
.modal-footer button.primary{background:var(--blue);color:#fff}
.modal-footer button.ghost{background:var(--blue-soft);color:var(--blue)}
.modal-footer button.danger{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.modal-footer button:active{transform:scale(.97);opacity:.88}
.pk-item{display:flex;align-items:center;gap:11px;width:100%;min-height:52px;padding:9px 17px;border-bottom:1px solid var(--border);color:var(--text);text-align:left}
.pk-item:last-child{border-bottom:0}
.pk-item .n{min-width:0;flex:1}
.pk-item .n strong{display:block;overflow:hidden;font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.pk-item .n span{display:block;overflow:hidden;color:var(--text-3);font:9px/1.4 var(--mono);text-overflow:ellipsis;white-space:nowrap}
.pk-item .ck{flex:none;width:23px;height:23px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;color:transparent;font-size:11px}
.pk-item.sel .ck{border-color:var(--blue);background:var(--blue);color:#fff}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 9px;border-radius:9px;background:var(--track-soft);color:var(--text-2);font:9px/1.4 var(--mono)}
.tag b{cursor:pointer;color:var(--red);font-size:12px;line-height:1}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px}
.tools button{min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;border:1px solid var(--border);border-radius:16px;background:var(--track-soft);color:var(--text);font-size:11px;font-weight:640}
.tools button em{color:var(--text-3);font:400 8px/1.2 var(--mono);font-style:normal}
.tools button:active{transform:scale(.97)}
.rawbox{width:100%;min-height:40vh;max-height:56vh;padding:13px;border:1px solid var(--border-hi);border-radius:18px;outline:0;background:rgba(11,12,16,.86);color:#c9cbd4;font:10px/1.7 var(--mono);resize:vertical}
html.no-ambient .ambient{display:none}
html.no-anim *,html.no-anim *::before,html.no-anim *::after{animation-duration:.001s!important;transition-duration:.001s!important}
html.no-dock .dock{display:none}
html.no-dock body{padding-bottom:26px}
html.no-dock .view{padding-bottom:4px}
.row.row-edit{align-items:center}
.row.row-edit input{flex:none}
.seg-mini{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--track-soft);flex:none}
.seg-mini button{padding:6px 11px;border-radius:9px;color:var(--text-2);font-size:10.5px;font-weight:650}
.seg-mini button.on{background:var(--glass-strong);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.logbox{max-height:44vh;overflow:auto;padding:12px 14px;border:1px solid var(--border-hi);border-radius:18px;background:rgba(11,12,16,.86);color:#afb1bc;font:10px/1.75 var(--mono);white-space:pre-wrap;word-break:break-all}
.chk{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 15px;border-bottom:1px solid var(--border)}
.chk:last-child{border-bottom:0}
.chk .ci{flex:none;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;font-size:11px;font-weight:800}
.chk .ci.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.chk .ci.no{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.chk .ci.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.chk .cn{flex:1;min-width:0;font-size:11.5px;font-weight:600}
.chk .cd{color:var(--text-3);font:9px/1.4 var(--mono);text-align:right;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{position:relative;overflow:hidden}
.mark img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
input[type=color]{-webkit-appearance:none;appearance:none;border:none;padding:0;background:none;width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 2px var(--border-hi)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.cpick{display:flex;align-items:center;gap:8px;flex:1}
.cpick span{color:var(--text-2);font-size:11px}
/* ── 迷你监视器：显示项 / 单项配色 / 位置方向盘 ── */
.monitem{display:flex;align-items:center;gap:8px;padding:4px 0}
.monitem .mi-lab{flex:1;color:var(--text-2);font-size:11px;font-family:var(--mono)}
.monitem input[type=color]{width:30px;height:30px;flex:0 0 30px}
.monitem .mi-auto{min-height:28px;padding:0 10px;border-radius:10px}
.monrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.monrow .chip-btn{min-height:32px;padding:0 10px;border-radius:11px}
.monmv{flex:none;width:42px;min-height:32px;border-radius:11px;background:var(--track-soft);color:var(--text-2);font:600 16px/1 var(--mono)}
.monmv:active{transform:scale(.94);color:var(--blue)}
.guard-stat{margin:0;padding:7px 12px;border:1px solid var(--border-hi);border-radius:14px;background:var(--track-soft);color:var(--text-2);font:11px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all}
.guard-stat.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.guard-stat.warn{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 40%,transparent)}
.psearch{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0));z-index:60;display:flex;gap:8px;align-items:center;padding:8px 10px 8px 14px;border:1px solid var(--border-hi);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.09),transparent 45%),var(--glass-strong);box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.psearch .term-input{height:36px}
.psearch .term-run{height:36px}
#toast{position:fixed;z-index:9999;right:18px;bottom:calc(98px + env(safe-area-inset-bottom,0));max-width:calc(100% - 36px);padding:11px 16px;border:1px solid var(--border-hi);border-radius:19px;background:var(--glass-strong);box-shadow:var(--shadow);font-size:11px;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:none}
@media (min-width:760px){.modal-mask{align-items:center}.modal{max-height:82vh}}
@container (max-width:370px){.metric-grid{gap:8px}.gauge-grid{grid-template-columns:1fr 1fr 1fr;gap:8px}.gauge{width:66px;height:66px}}
@media (max-width:370px){.dock-item{gap:5px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}.busy-spinner,.icon-btn.spin svg{animation-duration:.72s!important;animation-iteration-count:infinite!important}}
</style>

<script>
"use strict";
(function(){
/* ==== TOML-BEGIN ==== */
/* 极简 TOML 解析 / 序列化（只覆盖 device_faker 用到的子集 + 常见写法）
 * 支持：注释、裸键/引号键、点分键路径、[表] / [[数组表]]、
 *       基本字符串（含多行 """）、字面字符串（含多行 '''）、
 *       整数 / 浮点 / 布尔 / 数组 / 内联表
 * 不支持：日期时间（按字符串处理）、十六进制以外的特殊数字格式（按原文保留为数字）
 */
const TOML = (function(){
  function mkErr(msg, i, s){
    const line = s.slice(0, i).split("\n").length;
    const col = i - (s.lastIndexOf("\n", i - 1) + 1) + 1;
    const e = new Error("第 " + line + " 行第 " + col + " 列：" + msg);
    e.line = line; e.col = col;
    return e;
  }
  const isBareChar = c => (c >= "a" && c <= "z") || (c >= "A" && c <= "Z") || (c >= "0" && c <= "9") || c === "_" || c === "-";
  const isDigit = c => c >= "0" && c <= "9";

  function unescapeBasic(buf, i, s){
    let out = "";
    for(let k = 0; k < buf.length; k++){
      const c = buf[k];
      if(c !== "\\"){ out += c; continue; }
      const d = buf[++k];
      if(d === "n") out += "\n";
      else if(d === "t") out += "\t";
      else if(d === "r") out += "\r";
      else if(d === "b") out += "\b";
      else if(d === "f") out += "\f";
      else if(d === '"') out += '"';
      else if(d === "\\") out += "\\";
      else if(d === "u" || d === "U"){
        const len = d === "u" ? 4 : 8;
        const hex = buf.substr(k + 1, len);
        out += String.fromCodePoint(parseInt(hex, 16) || 0);
        k += len;
      } else if(d === "\n" || d === " " || d === "\t" || d === "\r"){
        // 多行字符串的续行反斜杠
      } else out += d;
    }
    return out;
  }

  function parse(text){
    const s = String(text == null ? "" : text).replace(/^\uFEFF/, "");
    const n = s.length;
    let i = 0;
    const root = {};
    let cur = root;

    function skipSp(){ while(i < n && (s[i] === " " || s[i] === "\t")) i++; }
    function skipComment(){ if(s[i] === "#"){ while(i < n && s[i] !== "\n") i++; } }
    function skipAll(){
      for(;;){
        skipSp();
        if(s[i] === "#"){ skipComment(); continue; }
        if(s[i] === "\r" || s[i] === "\n"){ i++; continue; }
        break;
      }
    }

    function parseKeyPath(){
      const parts = [];
      for(;;){
        skipSp();
        const c = s[i];
        if(c === '"' || c === "'") parts.push(parseString());
        else{
          const start = i;
          while(i < n && isBareChar(s[i])) i++;
          if(i === start) throw mkErr("缺少键名", i, s);
          parts.push(s.slice(start, i));
        }
        skipSp();
        if(s[i] === "."){ i++; continue; }
        break;
      }
      return parts;
    }

    function parseString(){
      const q = s[i];
      const tri = q === '"' ? '"""' : "'''";
      if(s.startsWith(tri, i)){
        i += 3;
        if(s[i] === "\r") i++;
        if(s[i] === "\n") i++;
        const end = s.indexOf(tri, i);
        if(end < 0) throw mkErr("多行字符串未闭合", i, s);
        let raw = s.slice(i, end);
        i = end + 3;
        if(q === '"') raw = unescapeBasic(raw, i, s);
        return raw.replace(/\r\n/g, "\n");
      }
      i++;
      if(q === "'"){
        const end = s.indexOf("'", i);
        if(end < 0) throw mkErr("字面字符串未闭合", i, s);
        const out = s.slice(i, end);
        i = end + 1;
        return out;
      }
      let buf = "";
      let closed = false;
      while(i < n){
        const c = s[i];
        if(c === '"'){ i++; closed = true; break; }
        if(c === "\\"){ buf += c + (s[i+1] || ""); i += 2; continue; }
        if(c === "\n") throw mkErr("基本字符串中不允许换行", i, s);
        buf += c; i++;
      }
      if(!closed) throw mkErr("基本字符串未闭合", i, s);
      return unescapeBasic(buf, i, s);
    }

    function parseNumber(){
      const start = i;
      if(s[i] === "+" || s[i] === "-") i++;
      while(i < n && /[0-9A-Fa-fxXoObB_.eE+\-]/.test(s[i])) i++;
      const raw = s.slice(start, i);
      if(/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw;          // 日期 -> 原样字符串
      const clean = raw.replace(/_/g, "");
      if(/^[+-]?0[xX]/.test(clean)) return parseInt(clean, 16);
      if(/^[+-]?0[oO]/.test(clean)) return parseInt(clean, 8);
      if(/^[+-]?0[bB]/.test(clean)) return parseInt(clean, 2);
      if(/[.eE]/.test(clean)) return parseFloat(clean);
      const v = parseInt(clean, 10);
      return isNaN(v) ? raw : v;
    }

    function parseValue(){
      skipSp();
      const c = s[i];
      if(c === undefined) throw mkErr("缺少值", i, s);
      if(c === '"' || c === "'") return parseString();
      if(c === "[") return parseArray();
      if(c === "{") return parseInlineTable();
      if(s.startsWith("true", i)){ i += 4; return true; }
      if(s.startsWith("false", i)){ i += 5; return false; }
      if(c === "+" || c === "-" || isDigit(c)) return parseNumber();
      throw mkErr("无法识别的值：" + JSON.stringify(s.slice(i, i + 12)), i, s);
    }

    function parseArray(){
      i++;
      const out = [];
      for(;;){
        skipAll();
        if(i >= n) throw mkErr("数组未闭合", i, s);
        if(s[i] === "]"){ i++; break; }
        out.push(parseValue());
        skipAll();
        if(s[i] === ","){ i++; continue; }
        if(s[i] === "]"){ i++; break; }
        throw mkErr("数组中缺少 , 或 ]", i, s);
      }
      return out;
    }

    function parseInlineTable(){
      i++;
      const out = {};
      for(;;){
        skipAll();
        if(i >= n) throw mkErr("内联表未闭合", i, s);
        if(s[i] === "}"){ i++; break; }
        const path = parseKeyPath();
        skipAll();
        if(s[i] !== "=") throw mkErr("内联表中缺少 =", i, s);
        i++;
        const v = parseValue();
        assign(out, path, v, s, i);
        skipAll();
        if(s[i] === ","){ i++; continue; }
        if(s[i] === "}"){ i++; break; }
        throw mkErr("内联表中缺少 , 或 }", i, s);
      }
      return out;
    }

    function descend(node, k){
      let v = node[k];
      if(Array.isArray(v)) v = v[v.length - 1];
      else if(v === undefined){ v = {}; node[k] = v; }
      if(typeof v !== "object" || v === null) throw mkErr("键名冲突：" + k, i, s);
      return v;
    }

    function assign(node, path, value, src, at){
      let t = node;
      for(let k = 0; k < path.length - 1; k++){
        let v = t[path[k]];
        if(Array.isArray(v)) v = v[v.length - 1];
        else if(v === undefined){ v = {}; t[path[k]] = v; }
        if(typeof v !== "object" || v === null) throw mkErr("键名冲突：" + path[k], at, src);
        t = v;
      }
      t[path[path.length - 1]] = value;
    }

    function parseTableHeader(){
      const isArr = s[i + 1] === "[";
      i += isArr ? 2 : 1;
      const path = parseKeyPath();
      skipSp();
      if(s[i] !== "]") throw mkErr("表头未闭合", i, s);
      i++;
      if(isArr){
        if(s[i] !== "]") throw mkErr("数组表头未闭合", i, s);
        i++;
      }
      let node = root;
      for(let k = 0; k < path.length - 1; k++) node = descend(node, path[k]);
      const last = path[path.length - 1];
      if(isArr){
        if(node[last] === undefined) node[last] = [];
        if(!Array.isArray(node[last])) throw mkErr("表名与已有键冲突：" + last, i, s);
        const el = {};
        node[last].push(el);
        return el;
      }
      if(node[last] === undefined) node[last] = {};
      if(Array.isArray(node[last])) return node[last][node[last].length - 1] || {};
      if(typeof node[last] !== "object" || node[last] === null) throw mkErr("表名与已有键冲突：" + last, i, s);
      return node[last];
    }

    while(true){
      skipAll();
      if(i >= n) break;
      if(s[i] === "["){ cur = parseTableHeader(); continue; }
      const path = parseKeyPath();
      skipSp();
      if(s[i] !== "=") throw mkErr("键后面缺少 =", i, s);
      i++;
      const v = parseValue();
      assign(cur, path, v, s, i);
    }
    return root;
  }

  function keyStr(k){
    return /^[A-Za-z0-9_-]+$/.test(k) ? k : JSON.stringify(k);
  }
  function valStr(v, depth){
    if(typeof v === "string") return JSON.stringify(v);
    if(typeof v === "boolean") return v ? "true" : "false";
    if(typeof v === "number") return isFinite(v) ? String(v) : "0";
    if(Array.isArray(v)){
      const items = v.map(x => valStr(x, depth + 1));
      const one = "[" + items.join(", ") + "]";
      if(one.length <= 80 && items.every(x => x.indexOf("\n") < 0)) return one;
      return "[\n" + items.map(x => "    " + x).join(",\n") + ",\n]";
    }
    if(v && typeof v === "object"){
      const ks = Object.keys(v);
      if(!ks.length) return "{}";
      return "{ " + ks.map(k => keyStr(k) + " = " + valStr(v[k], depth + 1)).join(", ") + " }";
    }
    return '""';
  }
  function isTableArr(v){
    return Array.isArray(v) && v.length > 0 &&
      v.every(x => x && typeof x === "object" && !Array.isArray(x));
  }
  function emit(tbl, path, lines){
    const simple = [], tables = [], arrayTables = [];
    Object.keys(tbl).forEach(k => {
      const v = tbl[k];
      if(v === undefined || v === null) return;
      if(isTableArr(v)) arrayTables.push(k);
      else if(Array.isArray(v)) simple.push(k);
      else if(typeof v === "object") tables.push(k);
      else simple.push(k);
    });
    simple.forEach(k => lines.push(keyStr(k) + " = " + valStr(tbl[k], 0)));
    tables.forEach(k => {
      const p = path.concat(k);
      if(lines.length) lines.push("");
      lines.push("[" + p.map(keyStr).join(".") + "]");
      emit(tbl[k], p, lines);
    });
    arrayTables.forEach(k => {
      const p = path.concat(k);
      tbl[k].forEach(el => {
        if(lines.length) lines.push("");
        lines.push("[[" + p.map(keyStr).join(".") + "]]");
        emit(el, p, lines);
      });
    });
  }
  function dump(obj){
    const lines = [];
    emit(obj || {}, [], lines);
    return lines.join("\n") + "\n";
  }
  return {parse, dump};
})();
/* ==== TOML-END ==== */

/* ============================================================

function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), s = Math.floor(sec%60);
  if(d) return d + " 天 " + h + " 时";
  if(h) return h + " 时 " + m + " 分";
  if(m) return m + " 分 " + s + " 秒";
  return s + " 秒";
}
function fmtDurSec(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), s = Math.floor(sec%60);
  const t = pad(h) + ":" + pad(m) + ":" + pad(s);
  return d > 0 ? d + " 天 " + t : t;
}
function clockStr(){
  const d = new Date();
  return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function fmtDTFull(ep){
  if(!ep || !isFinite(ep)) return "--";
  const d = new Date(ep * 1000);
  return (d.getMonth()+1) + "月" + d.getDate() + "日 " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function fmtDT(ep){
  if(!ep || !isFinite(ep)) return "--";
  const d = new Date(ep*1000);
  return (d.getMonth()+1) + "月" + d.getDate() + "日 " + pad(d.getHours()) + ":" + pad(d.getMinutes());

function fmtGB(kb){
  const n = num(kb);
  if(n === null || n <= 0) return "--";
  const g = n / 1048576;
  return (g >= 10 ? g.toFixed(1) : g.toFixed(2)) + " GB";
}
function fmtMHz(hz){
  const n = num(hz);
  if(n === null || n <= 0) return "--";
  return (n/1000).toFixed(n >= 1000000 ? 0 : 1) + " MHz";
}
function fmtHz(hz){
  const n = num(hz);
  if(n === null || n <= 0) return "--";
  return (n/1e6).toFixed(n >= 1e9 ? 0 : 1) + " MHz";
}
function pick(obj, keys){
  for(const k of keys){ const v = obj[k]; if(v !== undefined && v !== null && String(v).trim() !== "") return String(v).trim(); }
  return "";
}

    state.prefs = Object.assign({}, DEFAULT_PREFS, p);
  }

function resolveTheme(){
  const p = prefs();
  if(p.theme === "dark" || p.theme === "light") return p.theme;
  try{ return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; }
  catch(e){ return "dark"; }
}
function applyPrefs(){
  const p = prefs();
  const r = document.documentElement;
  r.dataset.theme = resolveTheme();
  r.classList.toggle("no-ambient", p.ambient !== "1");
  r.classList.toggle("no-anim", p.anim !== "1");
  r.classList.toggle("no-dock", p.dock !== "1");
}

    if(prefs().theme === "auto") applyPrefs();

/* ---------- HTTP 客户端（浏览器模式） ---------- */
const HTTPX = {base: "", token: "", active: false};
function initHttp(){
  try{
    if(!/^https?:$/.test(location.protocol)) return;
    HTTPX.base = location.href.replace(/[?#].*$/, "").replace(/[^/]*$/, "");
    let t = "";
    try{
      const q = new URL(location.href).searchParams.get("token");
      if(q){ t = q; localStorage.setItem("ksu_toolbox_token", q); }
    }catch(e){}
    if(!t){ try{ t = localStorage.getItem("ksu_toolbox_token") || ""; }catch(e){} }
    HTTPX.token = t;
    // /api/*.txt 是只读静态快照，本来就不需要令牌 —— 之前要求令牌
    // 导致直接输 127.0.0.1:8765 的人拿不到真实数据，是设计冗余。
    HTTPX.active = true;
  }catch(e){}
}
async function httpTask(task, timeout){
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), timeout || 15000);
  try{
    const r = await fetch(HTTPX.base + "api/" + task + ".txt?_=" + Date.now(), {signal: ctl.signal, cache: "no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  }finally{ clearTimeout(tm); }
}

/* ============================================================
 *  1. 与 root 管理器通信（KernelSU / SukiSU / KSU-Next / APatch）
 * ============================================================ */
function bridge(){
  return globalThis.ksu || globalThis.KernelSU || globalThis["$APATCH"] || globalThis.apatch || globalThis.APatch || null;
}
const HAS_BRIDGE = !!bridge();

function sh(cmd, timeout, task){
  // 浏览器模式：没有 ksu 桥，但有本地 HTTP 服务 → 去拿后台生成的快照
  const b0 = bridge();
  if((!b0 || typeof b0.exec !== "function") && HTTPX.active && task){
    return httpTask(task, timeout)
      .then(txt => ({errno:0, stdout:txt, stderr:""}))
      .catch(() => ({errno:-1, stdout:"", stderr:"__NOBRIDGE__"}));
  }
  return new Promise(resolve => {
    const b = bridge();
    if(!b || typeof b.exec !== "function"){ resolve({errno:-1, stdout:"", stderr:"__NOBRIDGE__"}); return; }
    const cbn = "__ksh_cb_" + Date.now().toString(36) + Math.random().toString(36).slice(2);
    let settled = false;
    let killer = 0;
    const done = (errno, stdout, stderr) => {
      if(settled) return;
      settled = true;
      clearTimeout(killer);
      try{ delete globalThis[cbn]; }catch(e){}
      resolve({errno: Number(errno) || 0, stdout: String(stdout == null ? "" : stdout), stderr: String(stderr == null ? "" : stderr)});
    };
    globalThis[cbn] = done;
    // 超时必须【先】武装 —— 原来写在 b.exec 之后，exec 一卡就永远武装不上
    killer = setTimeout(() => done(-1, "", "__TIMEOUT__"), timeout || 30000);
    let ret = null;
    try{
      ret = b.exec(cmd, "{}", cbn);
    }catch(e){
      try{ ret = b.exec(cmd); }catch(e2){ done(-1, "", String((e2 && e2.message) || e2)); return; }
    }
    if(ret && typeof ret.then === "function"){
      ret.then(r => {
        if(typeof r === "string") done(0, r, "");
        else if(r && typeof r === "object") done(r.errno == null ? 0 : r.errno, r.stdout || "", r.stderr || "");
        else done(0, String(r == null ? "" : r), "");
      }, e => done(-1, "", String(e)));
    }else if(typeof ret === "string" && ret){
      done(0, ret, "");
    }
  });
}
function parseKV(out){
  const m = {};
  String(out).split("\n").forEach(line => {
    const i = line.indexOf("=");
    if(i <= 0) return;
    const k = line.slice(0, i).trim();
    if(k) m[k] = line.slice(i + 1).trim();
  });
  return m;
}

async function fetchPerf(){
  const c = state.perfCache || (state.perfCache = {s: null, at: 0});
  if(!c.s || Date.now() - c.at > 30000){
    c.s = await fetchMap(PF_STATIC, "pfStatic", 20000);
    c.at = Date.now();
  }
  const d = await fetchMap(PF_DYN, "pfDyn", 15000);
  const out = Object.assign({}, c.s, d);
  if(!pick(out, ["memtotal_kb"])) Object.assign(out, await fetchMap(PF_STATIC, "pfStatic", 20000));
  return out;
}
async function fetchMap(lines, demoKind, timeout){
  // 不要在这里判断 HAS_BRIDGE —— 浏览器模式要走本地 HTTP 快照，
  // 短路掉就等于永远只有演示数据。统一交给 sh()，它自己会依次尝试
  // ksu 桥 → 本地 HTTP → 都没有才回 __NOBRIDGE__。
  const r = await sh(lines.join("; "), timeout, demoKind);
  if(r.stderr === "__NOBRIDGE__") return DEMO[demoKind]();
  const m = parseKV(r.stdout);
  if(Object.keys(m).length === 0 && r.stderr) m.__stderr = r.stderr;
  return m;
}

function bootState(s){
  const map = {green:"green（已锁定）", orange:"orange（已解锁）", yellow:"yellow（自定义密钥）", red:"red（校验失败）"};
  return map[String(s).toLowerCase()] || (s || "--");
}
function parseDf(line){
  if(!line) return null;
  const f = line.trim().split(/\s+/);
  if(f.length < 6) return null;
  const mount = f[f.length - 1];
  const pct = parseInt(f[f.length - 2], 10);
  const avail = num(f[f.length - 3]);
  const used = num(f[f.length - 4]);
  const total = num(f[f.length - 5]);
  if(total === null || used === null) return null;
  return {mount, total, used, avail, pct: isFinite(pct) ? pct : Math.round(used/total*100)};
}

function parseStatLine(line){
  if(!line) return null;
  const f = line.trim().replace(/^cpu\s*/, "").split(/\s+/).map(Number);
  if(f.length < 4) return null;
  const idle = (f[3] || 0) + (f[4] || 0);

  if(!line || !fill) return;
  if(arr.length < 2){ line.setAttribute("d", ""); fill.setAttribute("d", ""); return; }
  const n = arr.length, W = 100, H = 40;
  const max = Math.max(20, Math.ceil(Math.max.apply(null, arr) / 10) * 10);
  let d = "";
  arr.forEach((v, i) => {
    const x = n === 1 ? 0 : i / (n - 1) * W;
    const y = H - clamp(v / max, 0, 1) * (H - 3) - 1.5;
    d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
  });
  line.setAttribute("d", d);
  fill.setAttribute("d", d + " L" + W + " " + H + " L0 " + H + " Z");
}
function ensureCoreRows(n){
  const box = $("coreList");
  if(!box || n <= 0 || box.dataset.n === String(n)) return;
  let h = "";
  for(let i = 0; i < n; i++){
    h += '<div class="core"><b>CPU' + i + '</b><div class="bar"><i id="cbar' + i + '" style="width:0%"></i></div><em id="ctxt' + i + '">--</em></div>';
  }
  box.innerHTML = h;
  box.dataset.n = String(n);
}
function updatePerf(m){
  if(!m || state.tab !== "perf") return;
  const now = Date.now();
  const cores = parseInt(pick(m, ["cores"]), 10) || 0;

  const s1 = parseStatLine(pick(m, ["cpu_line"]));
  let cpuPct = null;
  if(s1 && state.prev.t && s1.total > state.prev.t){
    const dt = s1.total - state.prev.t, di = s1.idle - state.prev.i;
    cpuPct = clamp((dt - di) / dt * 100, 0, 100);
  }
  if(s1) state.prev = {t: s1.total, i: s1.idle, at: now};
  setRing("gCpu", cpuPct, colorFor(cpuPct || 0));
  setTxt("gCpuSub", (cores ? cores + " 核" : "--") + " · " + (pick(m, ["governor"]) || "--"));

  const gpuPct = gpuPercent(m);
  setRing("gGpu", gpuPct, colorFor(gpuPct || 0));
  setTxt("gGpuSub", [pick(m, ["gpu_model", "gpu_model2"]) || "未知 GPU", fmtHz(pick(m, ["gpu_cur"]))].filter(Boolean).join(" · "));

  const mem = memFromMap(m);
  const memPct = mem ? mem.used / mem.total * 100 : null;
  setRing("gMem", memPct, colorFor(memPct || 0));
  setTxt("gMemSub", mem ? fmtGB(mem.used) + " / " + fmtGB(mem.total) : "--");

  if(cpuPct !== null){ state.hist.cpu.push(cpuPct); if(state.hist.cpu.length > 48) state.hist.cpu.shift(); }
  patchSpark("sparkCpuLine", "sparkCpuFill", state.hist.cpu);
  const h = state.hist.cpu;
  setTxt("sparkCpuInfo", h.length ? ("峰值 " + Math.round(Math.max.apply(null, h)) + "% · 均值 " + Math.round(h.reduce((a, b) => a + b, 0) / h.length) + "% · " + h.length + " 点") : "采样中…");

  const freqs = pick(m, ["freqs"]).split(/\s+/).filter(Boolean).map(Number).filter(n => isFinite(n) && n > 0);
  const fmax = num(pick(m, ["freq_max"])) || (freqs.length ? Math.max.apply(null, freqs) : 0);
  const n = Math.max(cores, freqs.length);
  ensureCoreRows(n);
  for(let i = 0; i < n; i++){
    const f = freqs[i] || 0;
    const pct = fmax ? f / fmax * 100 : 0;
    const bar = $("cbar" + i), txt = $("ctxt" + i);
    if(bar){
      bar.style.width = clamp(pct, 0, 100).toFixed(1) + "%";
      bar.style.background = pct >= 88 ? "var(--orange)" : "";
    }
    if(txt) txt.textContent = f ? (f / 1000).toFixed(0) + " MHz" : "offline";
  }
  const fmin = num(pick(m, ["freq_min"]));
  setTxt("coreHint", (fmax ? "满频 " + (fmax / 1000).toFixed(0) + " MHz" : "--") + " / " + (fmin ? "最低 " + (fmin / 1000).toFixed(0) + " MHz" : "--"));

  const th = parseThermal(pick(m, ["thermal"]));
  const load = pick(m, ["loadavg"]).split(/\s+/);
  const html = [
    ["负载 1/5/15", load.length >= 3 ? load.slice(0, 3).join(" / ") : "--", ""],
    ["进程数", pick(m, ["procs"]) || "--", ""],
    ["CPU 温度", th.cpu || "--", th.cpuHot ? "warn" : ""],
    ["GPU 温度", th.gpu || "--", ""],
    ["GPU 调度器", pick(m, ["gpu_governor"]) || "--", ""],
    ["GPU 频率", fmtHz(pick(m, ["gpu_cur"])) + " / " + fmtHz(pick(m, ["gpu_max", "gpu_max2"]))],
    ["交换分区", mem && mem.swapTotal ? fmtGB(mem.swapTotal - mem.swapFree) + " / " + fmtGB(mem.swapTotal) : "--", ""]
  ].map(([k, v, cls]) => '<div class="row"><span>' + esc(k) + '</span><strong class="' + (cls || "") + '">' + esc(v) + '</strong></div>').join("");
  if(state.cache.perfRows !== html){ $("perfRows").innerHTML = html; state.cache.perfRows = html; }
}
function gpuPercent(m){
  let v = num(pick(m, ["gpu_util"]));   if(v !== null) return clamp(v, 0, 100);
  v = num(pick(m, ["gpu_util2"]));      if(v !== null) return clamp(v, 0, 100);
  v = num(pick(m, ["gpu_util3"]));      if(v !== null) return clamp(v, 0, 100);
  const busy = pick(m, ["gpu_busy"]);
  if(busy){
    const p = busy.trim().split(/\s+/).map(Number);
    if(p.length >= 2 && p[1] > 0) return clamp(p[0] / p[1] * 100, 0, 100);
  }
  v = num(pick(m, ["gpu_load"]));       if(v !== null) return clamp(v, 0, 100);
  return null;
}
function memFromMap(m){
  const total = num(pick(m, ["memtotal_kb"]));
  if(total === null || total <= 0) return null;
  const avail = num(pick(m, ["memavail_kb"]));
  const free = num(pick(m, ["memfree_kb"])) || 0;
  const buf = num(pick(m, ["buffers_kb"])) || 0;
  const ca = num(pick(m, ["cached_kb"])) || 0;
  const a = avail !== null ? avail : free + buf + ca;
  return {
    total, avail: a, used: Math.max(0, total - a),
    swapTotal: num(pick(m, ["swaptotal_kb"])) || 0,
    swapFree: num(pick(m, ["swapfree_kb"])) || 0
  };
}
function parseThermal(s){
  const out = {cpu:"", gpu:"", battery:"", cpuHot:false};
  if(!s) return out;
  s.split(";").forEach(seg => {
    const i = seg.indexOf("=");
    if(i <= 0) return;
    const type = seg.slice(0, i).toLowerCase(), raw = num(seg.slice(i + 1));
    if(raw === null || raw <= 0) return;
    const c = raw > 1000 ? raw / 1000 : raw;
    const txt = c.toFixed(1) + " °C";
    if(!out.battery && /batt|bms/.test(type)) out.battery = txt;
    if(!out.gpu && /gpu|gpuss|kgsl|mali/.test(type)) out.gpu = txt;
    if(!out.cpu && /cpu|soc|ap|tsens|core/.test(type)){ out.cpu = txt; out.cpuHot = c >= 65; }
  });
  return out;
}

function battVoltageUV(raw){

}

function yn(v){ return v === "1" ? "是" : v === "0" ? "否" : "--"; }
function estRemain(cap, curUA, fullMah){
  if(cap === null || !curUA || !fullMah) return "--";
  const mA = Math.abs(curUA) / 1000;
  const hours = (cap / 100 * fullMah) / mA;
  if(!isFinite(hours) || hours <= 0 || hours > 72) return "--";
  const mins = Math.round(hours * 60);
  if(mins < 60) return "剩余约 " + mins + " 分";
  return "剩余约 " + Math.floor(mins/60) + " 时 " + (mins%60) + " 分";
}

  if(!el) return;
  const frag = document.createDocumentFragment();
  for(let i = 0; i < rows.length; i++){
    const div = document.createElement("div");
    div.className = rows[i][0];
    div.textContent = rows[i][1];
    frag.appendChild(div);
  }
  el.appendChild(frag);
  while(el.childNodes.length > 300) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
function termLog(kind, text){
  const el = $("termOut");
  if(!el) return;
  const div = document.createElement("div");
  div.className = kind;
  div.textContent = text;
  el.appendChild(div);
  while(el.childNodes.length > 300) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
function pushHist(cmd){
  state.termHist = state.termHist.filter(c => c !== cmd);
  state.termHist.push(cmd);
  if(state.termHist.length > 60) state.termHist.shift();
  try{ localStorage.setItem("ksu_toolbox_hist", JSON.stringify(state.termHist)); }catch(e){}
}
let termHi = -1;
function clip(s, n){
  s = String(s == null ? "" : s);
  n = n || 120000;
  return s.length > n ? s.slice(0, n) + "\n… [输出过长，已截断 " + (s.length - n) + " 字符]" : s;
}
async function runCmd(cmd, label, display){
  cmd = String(cmd || "").trim();
  if(!cmd) return;
  /* display = 给人看的简短形式。
     内部命令经常是一大串 if/elif/else/fi（比如"执行文件"那段），
     原样回显会把终端刷满没人看得懂的东西。
     有 display 就只显示它 —— 历史记录也存它（内部的没人会想重跑）。 */
  const shown = (display != null && String(display).trim()) ? String(display).trim() : cmd;
  pushHist(shown);
  termHi = -1;
  termLog("cmd", (label ? "# " + label + "\n" : "") + "$ " + shown);
  const btn = $("termRun");
  if(btn) btn.disabled = true;
  const t0 = Date.now();
  try{
    const r = await sh(cmd, 90000);
    if(r.stderr === "__NOBRIDGE__"){
      termLog("sys", "未检测到 KernelSU 执行接口，当前为演示模式。");
      termLog("ok", "demo$ " + cmd + " → ok (演示)");
      return;
    }
    if(r.stderr === "__TIMEOUT__") termLog("err", "[超时] 90 秒内未返回，已放弃等待。");
    if(r.stdout) termLog("ok", clip(r.stdout).replace(/\s+$/, ""));
    if(r.stderr && r.stderr !== "__TIMEOUT__") termLog("err", clip(r.stderr).replace(/\s+$/, ""));
    const ms = Date.now() - t0;
    termLog("sys", `[退出码 ${r.errno} · ${ms} ms]`);
  }catch(e){
    termLog("err", String(e && e.message || e));
  }finally{
    if(btn) btn.disabled = false;
  }
}
function initTerm(){
  const out = $("termOut");
  if(out && !out.dataset.ready){
    out.dataset.ready = "1";
    termLog("sys", "KSU 系统工具箱 · root 终端已就绪");
    termLog("sys", HAS_BRIDGE ? "已检测到 WebUI 执行接口。" : "未检测到 KernelSU 环境，命令不会真正执行。");
  }
  const input = $("termInput");
  if(input){
    input.addEventListener("keydown", e => {
      if(e.key === "Enter"){ runCmd(input.value); input.value = ""; }
      else if(e.key === "ArrowUp"){
        if(!state.termHist.length) return;
        termHi = termHi < 0 ? state.termHist.length - 1 : Math.max(0, termHi - 1);
        input.value = state.termHist[termHi] || ""; e.preventDefault();
      }
      else if(e.key === "ArrowDown"){
        if(termHi < 0) return;
        termHi++;
        if(termHi >= state.termHist.length){ termHi = -1; input.value = ""; }
        else input.value = state.termHist[termHi] || "";
        e.preventDefault();
      }
    });
  }
  const run = $("termRun");
  if(run) run.addEventListener("click", () => { const i = $("termInput"); if(i){ runCmd(i.value); i.value = ""; } });
  const clear = $("termClear");
  if(clear) clear.addEventListener("click", () => { const o = $("termOut"); if(o) o.innerHTML = ""; termLog("sys", "已清空"); });
  const qr = $("quickRow");
  if(qr) qr.addEventListener("click", e => {
    const b = e.target.closest("[data-cmd]");
    if(b) runCmd(b.getAttribute("data-cmd"), b.textContent);
  });
  const fp = $("filePath");
  if(fp){
    const remembered = localStorage.getItem("ksu_toolbox_file") || "";
    if(remembered) fp.value = remembered;
  }
  const fr = $("fileRun");
  if(fr) fr.addEventListener("click", () => {
    const p = ($("filePath").value || "").trim();
    if(!p){ toast("先填一个路径"); return; }
    try{ localStorage.setItem("ksu_toolbox_file", p); }catch(e){}
    const cmd = `P=${shq(p)}; if [ -d "$P" ]; then echo "[目录] $P"; ls -la "$P"; ` +
      `elif [ -f "$P" ]; then echo "[执行] $P"; chmod 755 "$P" 2>/dev/null; ` +
      `if [ -x "$P" ]; then "$P"; else echo "[非可执行，改用 sh 运行]"; sh "$P"; fi; echo "[退出码] $?"; ` +
      `else echo "[错误] 路径不存在：$P"; fi`;
    runCmd(cmd, "执行文件", p);
  });
  const fl = $("fileList");
  if(fl) fl.addEventListener("click", () => {
    const p = ($("filePath").value || "").trim();
    if(!p){ toast("先填一个路径"); return; }
    runCmd(`P=${shq(p)}; if [ -e "$P" ]; then ls -ld "$P"; stat -c "%n %s bytes 权限%a 属主%U:%G 修改%y" "$P" 2>/dev/null || ls -l "$P"; file "$P" 2>/dev/null; else echo "[错误] 路径不存在：$P"; fi`, "文件信息", p);
  });
  const ls = $("fileLs");
  if(ls) ls.addEventListener("click", () => {
    const p = ($("filePath").value || "").trim();
    const dir = p ? (p.replace(/\/[^/]*$/, "") || "/") : "/data/adb/modules";
    runCmd(`ls -la ${shq(dir)}`, "列出 " + dir);
  });
}

      const r = await sh(c, 8000);

function b64utf8Decode(b){
  try{
    const bin = atob(String(b || "").replace(/[\s]/g, ""));
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }catch(e){ return ""; }
}
function b64utf8(s){
  const bytes = new TextEncoder().encode(String(s));
  let bin = "";
  for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
async function dfReadFile(path){
  const M1 = "___DFB___", M2 = "___DFE___";
  const r = await sh(`echo ${M1}; cat ${shq(path)} 2>/dev/null; echo ${M2}`, 25000);
  const s = r.stdout;
  const a = s.indexOf(M1), b = s.lastIndexOf(M2);
  if(a < 0 || b < 0) return "";
  return s.slice(a + M1.length + 1, b);
}
async function dfWriteFile(path, text){

}

function dfPutKey(obj, oldKey, newKey, value){

  if(!Object.prototype.hasOwnProperty.call(obj, oldKey)) out[newKey] = value;

  Object.keys(obj).forEach(k => delete obj[k]);
  order.forEach(k => { if(snap[k] !== undefined) obj[k] = snap[k]; });
}
function dfAllPackages(doc){
  const set = new Set();
  dfTplNames(doc).forEach(n => {
    const p = doc.templates[n].packages;
    if(Array.isArray(p)) p.forEach(x => set.add(String(x)));
  });
  dfApps(doc).forEach(a => { if(a.package) set.add(String(a.package)); });
  return [...set];
}

function dfSegBind(){
  document.querySelectorAll("#modalBody [data-tri]").forEach(el => {
    el.querySelectorAll("button").forEach(b => {
      b.onclick = () => {
        el.querySelectorAll("button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      };
    });
  });
}
function dfCollect(){
  const o = {};
  document.querySelectorAll("#modalBody [data-f]").forEach(el => {
    const v = el.value.trim();
    if(v !== "") o[el.getAttribute("data-f")] = v;
  });
  if(o.sdk_int !== undefined){
    const n = parseInt(o.sdk_int, 10);
    if(isFinite(n)) o.sdk_int = n; else delete o.sdk_int;
  }
  if(o.dpi !== undefined){
    const n = parseInt(o.dpi, 10);
    if(isFinite(n) && n >= 120 && n <= 640) o.dpi = n;
    else { delete o.dpi; toast("dpi 超出 120–640，已忽略"); }
  }
  document.querySelectorAll("#modalBody [data-tri]").forEach(el => {
    const k = el.getAttribute("data-tri");
    const on = el.querySelector("button.on");
    const v = on ? on.getAttribute("data-v") : "";
    if(v === "") delete o[k]; else o[k] = (v === "true");
  });
  const cp = $("dfCustomProps");
  if(cp){
    const map = {};
    cp.value.split("\n").forEach(line => {
      line = line.trim();
      if(!line || line.charAt(0) === "#") return;
      const i = line.indexOf("=");
      if(i <= 0) return;
      const unq = s => (s.length > 1 && ((s.charAt(0) === '"' && s.slice(-1) === '"') || (s.charAt(0) === "'" && s.slice(-1) === "'"))) ? s.slice(1, -1) : s;
      const k = unq(line.slice(0, i).trim());
      const v = unq(line.slice(i + 1).trim());
      if(k) map[k] = v;
    });
    if(Object.keys(map).length) o.custom_props = map; else delete o.custom_props;
  }
  const pk = $("dfPackages");
  if(pk){
    const arr = pk.value.split("\n").map(s => s.trim()).filter(s => s && s.charAt(0) !== "#");
    if(arr.length) o.packages = arr; else delete o.packages;
  }
  return o;
}

function dfTemplateEditor(ed){

  const body = `<div class="fld wide" style="margin-bottom:14px">

  openModal(ed.isNew ? "新建机型模板" : ed.key, "templates." + (ed.isNew ? "<名称>" : ed.key), body,
    `<button class="danger" data-act="df-cancel">${ed.isNew ? "取消" : "删除模板"}</button>
     <button class="primary" data-act="df-ok">保存模板</button>`);
  dfSegBind();
  const footer = $("modalFooter");
  footer.querySelector('[data-act="df-cancel"]').onclick = () => {

    const data = dfCollect();
    dfPutKey(doc.templates, ed.key, nm, data);
    closeModal(); st.dirty = true; renderDF();
    toast(st.demo ? "演示模式：改动只在内存里" : "已改动，记得点保存");
  };
  const pkBtn = $("modalBody").querySelector('[data-pick="multi"]');
  if(pkBtn){
    pkBtn.onclick = async () => {

      const picked = await dfPickPackages("multi", Array.isArray(snap.packages) ? snap.packages : []);

function dfAppEditor(ed){
  const st = dfState();
  const doc = dfDoc();
  const o = ed.data;
  const body = `<div class="fld wide"><label>包名 <b>package（必填）</b></label>
      <input id="dfAppPkg" value="${esc(o.package || "")}" placeholder="com.example.app 或 com.example.app@999" autocomplete="off" spellcheck="false"></div>

    `<button class="danger" data-act="df-cancel">${ed.isNew ? "取消" : "删除这条"}</button>
     <button class="primary" data-act="df-ok">保存</button>`);
  dfSegBind();
  const footer = $("modalFooter");
  footer.querySelector('[data-act="df-cancel"]').onclick = () => {
    if(ed.isNew){ closeModal(); return; }
    doc.apps.splice(ed.idx, 1);
    if(!doc.apps.length) delete doc.apps;
    closeModal(); st.dirty = true; renderDF();
  };
  footer.querySelector('[data-act="df-ok"]').onclick = () => {
    const pkg = ($("dfAppPkg").value || "").trim();
    if(!/^[A-Za-z0-9_.]+(@\d+)?$/.test(pkg)){ toast("包名不合法：只能是字母数字下划线点，可加 @用户ID"); return; }
    const data = dfCollect();
    data.package = pkg;
    if(!Array.isArray(doc.apps)) doc.apps = [];
    if(ed.isNew) doc.apps.push(data);
    else doc.apps[ed.idx] = data;
    closeModal(); st.dirty = true; renderDF();
    toast(st.demo ? "演示模式：改动只在内存里" : "已改动，记得点保存");
  };
  const pOne = $("modalBody").querySelector('[data-pick="one"]');
  if(pOne){
    pOne.onclick = async () => {
      const snap = dfCollect();

  const pStop = $("modalBody").querySelector('[data-pick="stop"]');
  if(pStop) pStop.onclick = () => dfForceStop(o.package);
}

/* ---------- 包名选择器（返回 Promise） ---------- */
function packagesInfo(names){
  try{
    const b = bridge();
    if(!b || typeof b.getPackagesInfo !== "function") return null;
    const j = b.getPackagesInfo(JSON.stringify(names));
    const arr = typeof j === "string" ? JSON.parse(j) : j;
    return Array.isArray(arr) && arr.length ? arr : null;
  }catch(e){ return null; }
}
async function dfPackages(){
  const st = dfState();
  if(st.pkgs) return st.pkgs;
  if(st.demo){
    st.pkgs = {
      user: ["com.example.custom", "com.example.game.one", "com.example.game.two", "com.example.other"],
      system: ["com.android.settings", "com.android.shell"]
    };
    return st.pkgs;
  }
  const r = await sh('echo "___U___"; pm list packages -3 2>/dev/null | sed "s/^package://"; echo "___S___"; pm list packages -s 2>/dev/null | sed "s/^package://"', 45000);
  const s = r.stdout;
  const a = s.indexOf("___U___"), b = s.indexOf("___S___");
  const cut = t => t.split("\n").map(x => x.trim()).filter(Boolean).sort();
  st.pkgs = {
    user: cut(a >= 0 && b > a ? s.slice(a + 7, b) : ""),
    system: cut(b >= 0 ? s.slice(b + 7) : "")
  };
  return st.pkgs;
}
function dfPickPackages(mode, selected){
  return new Promise(async resolve => {
    const st = dfState();
    const sel = new Set((selected || []).map(x => String(x).split("@")[0]));
    let data;
    try{ data = await dfPackages(); }
    catch(e){ toast("读不到应用列表"); resolve(null); return; }
    const known = dfAllPackages(st.doc).map(x => String(x).split("@")[0]);
    const extra = [...new Set(known)].filter(p => !data.user.includes(p) && !data.system.includes(p));
    const all = [...new Set([...data.user, ...data.system, ...extra])];
    if(!all.length){ toast("一个应用都没读到"); resolve(null); return; }
    if(!st.labels){
      const pi = packagesInfo(all.slice(0, 400));
      st.labels = {};
      if(pi) pi.forEach(p => { st.labels[p.packageName] = p.appLabel || ""; });
    }
    const labels = st.labels || {};
    const rows = (list, tag) => list.map(p => `<button class="pk-item ${sel.has(p) ? "sel" : ""}" data-pkg="${esc(p)}">
        <div class="n"><strong>${esc(labels[p] || p)}</strong>
        <span>${esc(labels[p] ? p : (tag === 1 ? "系统应用" : tag === 2 ? "配置里引用的包名" : "第三方应用"))}</span></div>
        <div class="ck">✓</div></button>`).join("");
    openModal(mode === "multi" ? "选择包名" : "选择一个包名",
      all.length + " 个应用" + (Object.keys(labels).length ? "（已匹配应用名）" : ""),
      `<div class="modal-search"><input class="modern-input" id="pkSearch" placeholder="搜索包名或应用名…" autocomplete="off" spellcheck="false"></div>
       <div class="row-list" id="pkList">${rows(data.user, 0)}${rows(data.system, 1)}${rows(extra, 2)}</div>`,
      mode === "multi"
        ? '<button data-act="pk-cancel">取消</button><button class="primary" data-act="pk-ok">加入列表</button>'
        : '<button data-act="pk-cancel">取消</button>');
    const search = $("pkSearch");
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll("#pkList .pk-item").forEach(el => {
        const t = (el.getAttribute("data-pkg") + " " + el.textContent).toLowerCase();
        el.style.display = (!q || t.indexOf(q) >= 0) ? "" : "none";
      });
    });
    let settled = false;
    $("pkList").addEventListener("click", e => {
      const b = e.target.closest(".pk-item");
      if(!b) return;
      const p = b.getAttribute("data-pkg");
      if(mode === "single"){
        settled = true;
        closeModal();
        resolve(p);
        return;
      }
      if(sel.has(p)){ sel.delete(p); b.classList.remove("sel"); }
      else { sel.add(p); b.classList.add("sel"); }
    });
    const foot = $("modalFooter");
    foot.querySelector('[data-act="pk-cancel"]').onclick = () => {
      if(!settled) resolve(null);
      closeModal();
    };
    if(mode === "multi"){
      foot.querySelector('[data-act="pk-ok"]').onclick = () => {
        settled = true;
        closeModal();
        const cur = (selected || []).map(x => String(x).trim()).filter(Boolean);
        const keep = cur.filter(x => !sel.has(String(x).split("@")[0]) || x.indexOf("@") > 0);
        resolve([...new Set([...keep, ...sel])]);
      };
    }
  });
}

function dfRawEditor(){
  const st = dfState();
  openModal("原始配置文本", DF.configPath,
    `<textarea class="rawbox" id="dfRaw" spellcheck="false">${esc(st.raw || "")}</textarea>
     <p class="field-hint">这里保存会原样写入，注释能保住。写入前会先做一次语法校验，并自动备份。</p>`,
    `<button data-act="raw-cancel">取消</button><button class="primary" data-act="raw-save">校验并保存</button>`);

  footer.querySelector('[data-act="raw-cancel"]').onclick = closeModal;
  footer.querySelector('[data-act="raw-save"]').onclick = async () => {
    const t = $("dfRaw").value;
    try{ TOML.parse(t); }
    catch(e){ toast("解析失败：" + e.message); return; }

async function dfBackupPanel(){
  const st = dfState();
  busy(true, "读取备份");
  let list = [];
  try{ list = st.demo ? ["config.toml.bak.20260927-091200"] : await dfListBackups(); }catch(e){}
  busy(false);
  const html = list.length
    ? `<div class="row-list">${list.map(n => `<div class="row" style="padding:9px 17px">
        <span style="flex:1;text-align:left;color:var(--text);font-size:10px">${esc(n.replace("config.toml.bak.", ""))}</span>

    : '<p class="field-hint" style="margin:14px 17px">还没有备份。每次保存前会自动生成一份。</p>';
  openModal("备份与还原", list.length + " 份",
    html + '<p class="field-hint" style="margin:10px 17px 0">还原前会先把当前版本也备份一次，所以不会丢东西。</p>',
    '<button class="ghost" data-act="bak-now">立即备份当前配置</button><button data-act="bak-close">关闭</button>');
  const footer = $("modalFooter");
  footer.querySelector('[data-act="bak-close"]').onclick = closeModal;
  footer.querySelector('[data-act="bak-now"]').onclick = async () => {
    closeModal();
    if(st.demo){ toast("演示模式"); return; }
    busy(true, "备份中");
    const b = await dfBackup();
    busy(false);

  };

    const b = e.target.closest("[data-bak]");

    if(st.demo){ toast("演示模式"); return; }

async function dfFromDevice(){
  busy(true, "读取本机属性");
  let m;
  try{ m = await fetchMap(OV_LINES, "ov", 20000); }
  finally{ busy(false); }
  const st = dfState();
  const doc = dfDoc();
  if(!doc.templates || typeof doc.templates !== "object" || Array.isArray(doc.templates)) doc.templates = {};
  const o = {};
  const set = (k, v) => { const t = String(v == null ? "" : v).trim(); if(t) o[k] = t; };
  set("manufacturer", m["ro.product.manufacturer"]);
  set("brand", m["ro.product.brand"]);
  set("marketname", m["ro.product.marketname"]);
  set("model", m["ro.product.model"]);
  set("name", m["ro.product.name"]);
  set("device", m["ro.product.device"]);
  set("product", m["ro.product.name"]);
  set("hardware", m["ro.hardware"]);
  set("board", m["ro.product.board"]);
  set("characteristics", m["ro.build.characteristics"]);
  set("fingerprint", m["ro.build.fingerprint"]);
  set("build_id", m["ro.build.id"]);
  set("display_id", m["ro.build.display.id"]);
  set("security_patch", m["ro.build.version.security_patch"]);
  set("android_version", m["ro.build.version.release"]);
  const sdk = parseInt(m["ro.build.version.sdk"], 10);
  if(isFinite(sdk)) o.sdk_int = sdk;

  const base = (o.model || o.brand || "device") + "-本机";
  let name = base, i = 2;
  while(doc.templates[name] !== undefined){ name = base + "-" + i++; }
  doc.templates[name] = o;
  st.dirty = true;
  renderDF();
  toast("已按本机参数新建模板 " + name + "，记得点保存");

async function dfRestartAll(){
  const st = dfState();
  const pkgs = dfAllPackages(st.doc);
  if(!pkgs.length){ toast("配置里还没有包名"); return; }
  busy(true, "结束 " + pkgs.length + " 个应用");
  let n = 0;
  for(const p of pkgs){ if(await dfForceStop(p, true)) n++; }
  busy(false);
  toast("已结束 " + n + " 个应用，下次启动生效");
}
async function dfSave(){
  const st = dfState();
  if(!st.doc){ toast("没有可保存的内容"); return; }
  const txt = TOML.dump(st.doc);
  try{ TOML.parse(txt); }
  catch(e){ toast("生成的 TOML 有问题，已中止：" + e.message); return; }
  if(st.demo){ toast("演示模式：生成没问题，但没写入"); return; }
  busy(true, "写入配置");
  try{
    const bak = st.cfgExists ? await dfBackup() : "";
    const ok = await dfWriteFile(DF.configPath, txt);
    if(!ok){ toast("写入失败"); return; }
    toast(bak ? "已保存 · 备份 " + bak : "已保存");
  }finally{ busy(false); }
  await loadDF();
}
let clockTimer = 0;
function tickClock(force){
  const c = state.clock;
  if(state.tab !== "home") return;
  if(!c.at){
    if(force){ setTxt("mUptime", "--"); setTxt("mUptimeSub", "读取中…"); setTxt("mBootSub", "--"); }
    return;
  }
  const secs = c.base + (Date.now() - c.at) / 1000;
  setTxt("mUptime", fmtDurSec(secs));
  setTxt("mUptimeSub", "现在 " + clockStr());
  setTxt("mBootSub", "开机于 " + fmtDurSec(secs) + " 前");
}
function startClock(){
  clearInterval(clockTimer);
  tickClock(true);
  clockTimer = setInterval(() => tickClock(false), 1000);
}
function stopClock(){ clearInterval(clockTimer); clockTimer = 0; }

async function handleDFAction(act, el){
  const st = dfState();
  const k1 = el.getAttribute("data-k1");
  if(act === "df-save") await dfSave();
  else if(act === "df-discard"){ st.dirty = false; await loadDF(); }
  else if(act === "df-reload"){ await loadDF(); toast("已重新读取"); }
  else if(act === "df-native"){ location.href = "./df.html"; }
  else if(act === "df-open-tpl"){
    const doc = dfDoc();
    dfTemplateEditor({key: k1, input: k1, data: Object.assign({}, (doc.templates || {})[k1] || {}), isNew: false});
  }
  else if(act === "df-newtpl") dfTemplateEditor({key: "", input: "", data: {}, isNew: true});
  else if(act === "df-open-app"){
    const doc = dfDoc();
    const idx = parseInt(k1, 10);
    dfAppEditor({idx, data: Object.assign({}, (doc.apps || [])[idx] || {}), isNew: false});
  }
  else if(act === "df-newapp") dfAppEditor({idx: -1, data: {}, isNew: true});
  else if(act === "df-raw") dfRawEditor();
  else if(act === "df-backups") await dfBackupPanel();
  else if(act === "df-from-device") await dfFromDevice();
  else if(act === "df-newcfg") dfNewConfig();
  else if(act === "df-reset-cfg") await dfResetConfig();
  else if(act === "df-restart-all") await dfRestartAll();
  else if(act === "clean-pick") await cleanPick();
  else if(act === "clean-scan") await cleanScan();
  else if(act === "clean-white") editWhiteList();
  else if(act === "clean-run") cleanConfirm();
  else if(act === "id-regen") await regenAndroidId();
  else if(act === "clean-toggle"){
    const k = "e:" + k1;
    if(isWhite(k1)){ toast("「" + k1 + "」在保留名单里，先去「编辑保留名单」把它删掉"); return; }
    cleanState().sel[k] = !cleanState().sel[k];
    renderDF();
  }
  else if(act === "clean-opt"){
    const st2 = cleanState();
    st2.sel[k1] = !st2.sel[k1];
    renderDF();
  }
  else if(act === "df-global"){
    const doc = dfDoc();
    const cur = doc[k1];
    if(cur === undefined) doc[k1] = true;
    else if(cur === true) doc[k1] = false;
    else delete doc[k1];
    st.dirty = true;
    renderDF();
  }
}

function randAndroidId(){
  let s = "";
  for(let i = 0; i < 16; i++) s += "0123456789abcdef".charAt(Math.floor(Math.random() * 16));
  return s;
}
function randSsaid(){
  let s = "";
  for(let i = 0; i < 18; i++) s += Math.floor(Math.random() * 10);
  s = s.replace(/^0+/, "");
  return s || "1";
}
function cleanState(){
  if(!state.clean){
    let w = "";
    try{ w = localStorage.getItem("ksu_toolbox_clean_white") || ""; }catch(e){}
    state.clean = {pkg: "", white: w || "QtsVFSCache, UE4Game", scan: null, size: null, sel: {}, running: false};
  }
  return state.clean;
}
function cleanWhite(){
  return cleanState().white.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean);
}
function isWhite(name){ return cleanWhite().indexOf(name) >= 0; }

function cleanProbeCmd(pkg){
  return [
    `P=${shq(pkg)}`,
    `echo "pkg=$P"`,
    `echo "has_data=$([ -d /data/data/$P ] && echo 1 || echo 0)"`,
    `echo "has_ext=$([ -d /sdcard/Android/data/$P ] && echo 1 || echo 0)"`,
    `echo "has_obb=$([ -d /sdcard/Android/obb/$P ] && echo 1 || echo 0)"`,
    `echo "android_id=$(settings get secure android_id 2>/dev/null)"`,
    `F=/data/system/users/0/settings_ssaid.xml; S=""; [ -f "$F" ] && S=$(grep ${shq('package="' + pkg + '"')} "$F" 2>/dev/null | head -n 1); echo "ssaid=$S"`,
    `e=""; for x in /data/data/$P/*; do [ -e "$x" ] || continue; b=\${x##*/}; e="$e|$b"; done; echo "entries=$e"`
  ].join("; ");
}
function cleanSizeCmd(pkg){
  return [
    `P=${shq(pkg)}`,
    `echo "size_kb=$(du -sk /data/data/$P 2>/dev/null | cut -f 1)"`,
    `echo "ext_kb=$(du -sk /sdcard/Android/data/$P 2>/dev/null | cut -f 1)"`,
    `echo "obb_kb=$(du -sk /sdcard/Android/obb/$P 2>/dev/null | cut -f 1)"`
  ].join("; ");
}

async function cleanPick(){
  const c = cleanState();
  const p = await dfPickPackages("single", c.pkg ? [c.pkg] : []);
  if(!p) return;
  c.pkg = p; c.scan = null; c.size = null; c.sel = {};
  renderDF();
  cleanScan();
}
async function cleanScan(){
  const c = cleanState();
  if(!c.pkg) return;
  busy(true, "扫描 " + c.pkg);
  let m = null;
  try{
    const r = await sh(cleanProbeCmd(c.pkg), 30000);
    m = r.stderr === "__NOBRIDGE__" ? null : parseKV(r.stdout);
  }finally{ busy(false); }
  if(!m){
    m = {pkg: c.pkg, has_data: "1", has_ext: "1", has_obb: "1",
         android_id: dfState().androidId || "-", ssaid: 'x name="10001" value="845123094123876541"',
         entries: "|files|shared_prefs|databases|cache|code_cache|QtsVFSCache|UE4Game"};
  }
  const entries = String(m.entries || "").split("|").map(s => s.trim()).filter(Boolean);
  c.scan = {
    hasData: m.has_data === "1", hasExt: m.has_ext === "1", hasObb: m.has_obb === "1",
    androidId: m.android_id || "-", entries,
    ssaid: m.ssaid || "",
    ssaidVal: (() => { const r = /value="(\d+)"/.exec(m.ssaid || ""); return r ? r[1] : ""; })(),
    ssaidName: (() => { const r = /name="(\d+)"/.exec(m.ssaid || ""); return r ? r[1] : ""; })()
  };
  c.sel = {};
  ["ext", "obb", "ssaid"].forEach(k => { c.sel[k] = true; });
  c.sel.androidid = false;
  c.sel.data = true;
  c.size = null;
  entries.forEach(e => { c.sel["e:" + e] = !isWhite(e); });
  renderDF();
  const r2 = await sh(cleanSizeCmd(c.pkg), 90000);
  if(r2.stderr !== "__NOBRIDGE__"){
    const s = parseKV(r2.stdout);
    c.size = {data: num(s.size_kb) || 0, ext: num(s.ext_kb) || 0, obb: num(s.obb_kb) || 0};
    renderDF();
  }
}
function cleanMB(kb){
  const n = num(kb);
  if(n === null || n <= 0) return null;
  return n >= 1048576 ? (n / 1048576).toFixed(2) + " GB" : (n / 1024).toFixed(0) + " MB";
}

function cleanConfirm(){
  const c = cleanState();
  const s = c.scan || {};
  const del = (s.entries || []).filter(e => c.sel["e:" + e]);
  const parts = [];
  if(c.sel.data && del.length) parts.push("删除 " + del.length + " 个数据目录（" + del.join("、") + "）");
  if(c.sel.ext) parts.push("清除外部数据");
  if(c.sel.obb) parts.push("清除 OBB");
  if(c.sel.ssaid) parts.push("重置 SSAID");
